<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDF7E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성장 다마고치">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>성장 다마고치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF7E8; --paper: #FFFDF7; --ink: #4A3529; --ink-soft: #8C7466; --line: #E9DCC8;
    --sage: #AFCB8F; --sage-pale: #EAF2DD; --blush: #F4B4AC; --blush-pale: #FCE6E1;
    --butter: #F6D978; --butter-pale: #FBF0C9; --shadow: #F0E2CB;
    --hand: "Gaegu", "Gowun Dodum", cursive;
    --body: "Gowun Dodum", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--body); overscroll-behavior: none; }
  body { background-image: radial-gradient(circle at 12% 8%, #fff8e0 0, transparent 40%), radial-gradient(circle at 90% 30%, #fbeee6 0, transparent 35%); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 110px; }
  h1, h2, h3, .hand { font-family: var(--hand); font-weight: 700; }
  h1 { font-size: 30px; margin: 4px 0 2px; }
  h2 { font-size: 24px; margin: 0 0 10px; }
  h3 { font-size: 20px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  .card { background: var(--paper); border: 2px solid var(--ink); border-radius: 24px 28px 26px 22px; padding: 18px; margin-bottom: 16px; box-shadow: 0 6px 0 var(--shadow); }
  .card.soft { border-color: var(--line); box-shadow: none; }

  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 16px; outline: none; -webkit-appearance: none; appearance: none; min-height: 48px;
  }
  input:focus { border-color: #7FA461; }
  input::placeholder { color: #C5B4A6; }

  button { font: inherit; color: var(--ink); cursor: pointer; border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 11px 18px; font-size: 15px; transition: transform .08s, box-shadow .08s; box-shadow: 0 3px 0 var(--ink); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button:disabled { opacity: .35; cursor: default; transform: none; box-shadow: 0 3px 0 var(--ink); }
  .btn-primary { background: var(--sage); font-family: var(--hand); font-weight: 700; font-size: 20px; padding: 10px 22px; }
  .btn-pink { background: var(--blush); }
  .btn-ghost { border-color: var(--line); box-shadow: none; background: transparent; color: var(--ink-soft); }
  .btn-ghost:active { box-shadow: none; }
  .btn-sm { font-size: 13px; padding: 6px 12px; box-shadow: 0 2px 0 var(--ink); }
  .btn-danger { color: #B04A3E; border-color: #E5B3AA; box-shadow: none; background: transparent; }
  .btn-danger:active { box-shadow: none; }
  .btn-block { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 110px; }
  .err { color: #B04A3E; font-size: 13px; margin-top: 8px; min-height: 1em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 2px solid var(--line); border-radius: 999px; font-size: 14px; background: #fff; cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); flex-shrink: 0; }

  .bar { height: 14px; background: #F3EBDD; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; transition: width .5s ease; }
  .bar.thin { height: 10px; border-width: 1.5px; }

  /* 친구들 무대 */
  .friends { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 16px; }
  .friend { background: var(--paper); border: 2px solid var(--ink); border-radius: 26px; padding: 12px 8px 14px; text-align: center; cursor: pointer; box-shadow: 0 6px 0 var(--shadow); position: relative; transition: transform .15s; }
  .friend:active { transform: translateY(3px); }
  .friend .spot { position: relative; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
  .friend .spot::before { content: ""; position: absolute; bottom: 4px; width: 78%; height: 46px; border-radius: 50%; background: var(--c-bg); }
  .sprite { position: relative; max-width: 92%; animation: bob 2.8s ease-in-out infinite; transform-origin: bottom center; user-select: none; -webkit-user-drag: none; }
  .friend:nth-child(2) .sprite { animation-delay: -.9s; }
  .friend:nth-child(3) .sprite { animation-delay: -1.8s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .prop { position: absolute; top: 6px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; font-family: var(--hand); z-index: 1; }
  .friend .fname { font-family: var(--hand); font-size: 23px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--c-bg); margin-top: 4px; }
  .friend .today { font-family: var(--hand); font-size: 20px; font-weight: 700; margin-top: 8px; }
  .friend .bar { margin: 6px 6px 0; }
  .friend .tap { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  .running { display: inline-flex; align-items: center; gap: 5px; font-family: var(--hand); font-weight: 700; font-size: 18px; background: var(--blush-pale); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; margin-top: 8px; }
  .running::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #E2685A; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .sum-line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px dashed var(--line); }
  .sum-line:first-child { border-top: 0; padding-top: 2px; }
  .sum-line img { width: 52px; height: 52px; object-fit: contain; }
  .sum-line .t { font-family: var(--hand); font-size: 20px; font-weight: 700; line-height: 1.2; }

  .timer-card { display: flex; align-items: center; gap: 14px; background: var(--blush-pale); }
  .timer-card img { width: 70px; height: 70px; object-fit: contain; }
  .timer-card .clock { font-family: var(--hand); font-size: 36px; font-weight: 700; line-height: 1; }


  /* 마을 장면 */
  .scene-wrap { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior: none; background: #F3E7D3 center / cover no-repeat; }
  .scene-wrap::before { content: ""; position: fixed; inset: -20px; background: inherit; filter: blur(14px) saturate(1.05); z-index: -1; }
  .scene-wrap::-webkit-scrollbar { display: none; }
  .scene { position: relative; width: max(100vw, calc(100vh * 1.3333)); aspect-ratio: 1448 / 1086; }
  @supports (height: 100dvh) { .scene { width: max(100vw, calc(100dvh * 1.3333)); } }
  .village { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .npc { position: absolute; transform: translate(-50%, -100%); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .npc .body { position: relative; width: 100%; }
  .npc .body::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -4%; height: 16%; border-radius: 50%; background: rgba(74,53,41,.18); filter: blur(2px); z-index: -1; }
  .npc .sprite { width: 100%; max-width: none; display: block; animation: bob 2.8s ease-in-out infinite; transform-origin: bottom center; filter: drop-shadow(0 2px 0 rgba(255,255,255,.7)); user-select: none; -webkit-user-drag: none; }
  .npc:nth-of-type(2) .sprite { animation-delay: -.7s; } .npc:nth-of-type(3) .sprite { animation-delay: -1.4s; } .npc:nth-of-type(4) .sprite { animation-delay: -2.1s; }
  .npc:active .sprite { animation: pop .35s ease; }
  .npc .prop { top: -4%; right: -10%; width: clamp(22px, 2.2vw, 34px); height: clamp(22px, 2.2vw, 34px); font-size: clamp(11px, 1.1vw, 17px); }
  .tagline { display: flex; flex-direction: column; align-items: center; background: rgba(255,253,247,.94); border: 2px solid var(--ink); border-radius: 14px; padding: 2px 10px 3px; margin-bottom: 4px; white-space: nowrap; box-shadow: 0 3px 0 rgba(74,53,41,.25); position: relative; }
  .tagline::after { content: ""; position: absolute; bottom: -7px; left: 50%; width: 10px; height: 10px; background: rgba(255,253,247,.94); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  .tagline .nm { font-family: var(--hand); font-weight: 700; font-size: clamp(15px, 1.5vw, 21px); line-height: 1.05; }
  .tagline .tm { font-size: clamp(10px, .95vw, 13px); color: var(--ink-soft); line-height: 1.1; }
  .tagline .run { font-family: var(--hand); font-weight: 700; font-size: clamp(13px, 1.2vw, 17px); color: #C4473A; line-height: 1.1; }
  .npc .mini { width: 70%; height: 7px; margin-top: 3px; background: rgba(255,253,247,.9); border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; }
  .npc .mini i { display: block; height: 100%; background: var(--c-main); }
  /* 찬양 콘티 */
  .ws-modal { width: min(640px, 100%); }
  .ws-modal > div { min-width: 0; }
  .ws-panel textarea, .ws-modal textarea { width: 100%; min-height: 160px; font-size: 15px; line-height: 1.5; }
  .ws-panel .ws-list { max-height: none; }
  .ws-list { display: flex; flex-direction: column; gap: 8px; max-height: min(52vh, 460px); overflow: auto; padding: 2px; }
  .ws-row { display: flex; align-items: center; gap: 8px; background: #FFFDF7; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; }
  .ws-row.miss { background: #FBF3EA; border-style: dashed; }
  .ws-n { width: 26px; height: 26px; border-radius: 50%; background: var(--c-main); border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; flex: none; font-size: 13px; }
  .ws-q { font-weight: 700; }
  .ws-hit { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .ws-alt { margin-top: 4px; font-size: 12.5px; padding: 3px 6px; max-width: 100%; border-radius: 8px; }
  .ws-go { background: #FFE9A8; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .ws-row a.btn-sm { text-decoration: none; color: var(--ink); white-space: nowrap; }
  .ws-del { padding: 4px 8px; background: transparent; box-shadow: none; border: none; color: var(--ink-soft); }
  /* 아이패드: 빠르게 두 번 누르면 화면이 확대되는 것 막기(두 손가락 확대는 그대로) */
  *, *::before, *::after { touch-action: manipulation; }
  /* 아이패드: 글자가 16px보다 작은 입력칸을 누르면 화면이 확대돼서, 입력칸만 16px로 */
  @supports (-webkit-touch-callout: none) { input, select, textarea { font-size: max(16px, 1em) !important; } }
  .ws-bpm { font-size: 12.5px; margin-top: 2px; }
  .ws-bpm b { font-size: 15px; }
  .ws-bpm.unsure b { color: #B4782A; }
  .ws-bpm-s { font-size: 12px; background: #FFE9A8; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
  .ws-met { background: #FFE9A8; padding: 4px 8px; }
  .metro-modal { width: min(520px, 100%); text-align: center; }
  .mt-stage { margin: 8px 0 4px; }
  .mt-video:empty { display: none; }
  .mt-video { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); margin-bottom: 10px; background: #000; }
  .mt-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .mt-dd { width: 120px; height: 120px; object-fit: contain; transform-origin: bottom center; }
  .mt-dd.hit { animation: mtHit .16s ease-out; }
  @keyframes mtHit { 0% { transform: scale(1.12, .9); } 100% { transform: scale(1); } }
  .mt-bpm { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .mt-bpm b { display: block; font-family: var(--hand); font-size: 64px; line-height: 1; }
  .mt-bpm span { font-size: 13px; color: var(--ink-soft); }
  .mt-pm { width: 60px; height: 60px; border-radius: 50%; font-size: 28px; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mt-pm.holding { background: #FFE9A8; transform: scale(.94); }
  .metro-modal button, .metro-modal .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #mt-range { width: 100%; margin: 10px 0 6px; accent-color: #E0A93A; }
  .mt-dots { display: flex; justify-content: center; gap: 10px; margin: 6px 0 4px; }
  .mt-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); background: #FFFDF7; transition: background .05s; }
  .mt-dots i.acc { border-width: 3px; }
  .mt-dots i.on { background: #F2B544; }
  .mt-row { justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .mt-play { margin-top: 12px; font-size: 18px; padding: 12px; }
  @media (prefers-reduced-motion: reduce) { .mt-dd.hit { animation: none; } }
  .ws-recent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1.5px dashed rgba(74,53,41,.25); }
  /* 말풍선: 친구들이 할 일 알려주기 */
  .npc.talking { z-index: 3; }
  .talk { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); margin-left: var(--tk-dx, 0px); width: max-content; max-width: min(230px, 60vw); background: var(--tk-bg, #FFFDF7); border: 2px solid var(--ink); border-radius: 20px; padding: 8px 13px 7px; box-shadow: 0 4px 0 rgba(74,53,41,.22); text-align: left; cursor: pointer; z-index: 3; }
  .talk::after { content: ""; position: absolute; bottom: -8px; left: 50%; width: 12px; height: 12px; margin-left: calc(-1 * var(--tk-dx, 0px)); background: var(--tk-bg, #FFFDF7); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  .talk > * { position: relative; }
  .talk .tx { font-size: clamp(13px, 1.15vw, 15px); line-height: 1.4; white-space: normal; word-break: keep-all; color: var(--ink); }
  .talk .tx b { color: var(--ink); background: linear-gradient(transparent 58%, var(--c-main) 58%); }
  .talk .tk-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .talk.chat .tx { font-family: var(--hand); font-size: clamp(16px, 1.45vw, 19px); }
  .talk .tk-act { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: #FFFDF7; border: 1.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
  .talk .tk-n { font-size: 11px; color: var(--ink-soft); white-space: nowrap; margin-left: auto; }
  .talk.pop { animation: talkPop .45s cubic-bezier(.3,1.5,.5,1) both; }
  .talk.out { animation: talkOut .3s ease forwards; }
  @keyframes talkPop { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.6); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes talkOut { to { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.85); } }
  @media (prefers-reduced-motion: reduce) { .talk.pop, .talk.out { animation-duration: .01s; animation-delay: 0s !important; } }
  .quick button { position: relative; }
  .quick .tk-dot { position: absolute; top: -6px; right: -6px; font-size: 15px; line-height: 1; filter: drop-shadow(0 1px 0 #fff); }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 4; }
  .hud > * { pointer-events: auto; }
  .hud-card { background: rgba(255,253,247,.93); border: 2px solid var(--ink); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 rgba(74,53,41,.2); }
  .hud-btn { background: rgba(255,253,247,.95); }
  .quick { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 84px); left: 12px; display: none; gap: 6px; z-index: 4; }
  .quick button { width: 48px; height: 48px; border-radius: 50%; padding: 2px; background: var(--c-bg); box-shadow: 0 3px 0 var(--ink); }
  .quick img { width: 100%; height: 100%; object-fit: contain; }
  @media (max-aspect-ratio: 5/4) { .quick { display: flex; } .hint { top: 152px; } }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); top: 84px; background: var(--butter-pale); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; z-index: 4; white-space: nowrap; animation: nudge 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes nudge { 50% { transform: translate(-50%, 4px); } }
  .timer-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 72px); display: flex; align-items: center; gap: 10px; background: var(--c-bg); border: 2px solid var(--ink); border-radius: 22px; padding: 6px 10px 6px 6px; box-shadow: 0 4px 0 rgba(74,53,41,.25); z-index: 5; white-space: nowrap; }
  .timer-pill img { width: 46px; height: 46px; object-fit: contain; }
  .timer-pill .clock { font-family: var(--hand); font-size: 24px; font-weight: 700; line-height: 1; }


  /* 주간 시간표 */
  /* 계절 배경 위에 고정된 시간표 화면 (배경 그림 = 장식, 일정표·버튼은 실제 UI) */
  .tt-page { position: fixed; inset: 0; z-index: 1; background: var(--cream) center / 100% 100% no-repeat; --l: 10%; --r: 10%; --t: 2.5%; --b: 12%; }
  .tt-page.s-spring { --l: 4.5%; --r: 4.5%; --t: 16%; --b: 9%; }
  .tt-page.s-summer { --l: 10%; --r: 7.5%; --t: 19%; --b: 13%; }
  .tt-page.s-winter { --l: 11.5%; --r: 11.5%; --t: 22%; --b: 15%; }
  .tt-inner { position: absolute; left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - var(--l) - var(--r))); top: max(var(--t), env(safe-area-inset-top)); bottom: max(var(--b), calc(max(14px, env(safe-area-inset-bottom)) + 84px)); display: flex; flex-direction: column; padding: 12px 18px 8px; min-width: 0; }
  @media (max-aspect-ratio: 1/1) { .tt-page { background-size: cover; } .tt-inner { width: min(720px, calc(100% - 28px)); top: max(16px, env(safe-area-inset-top)); } }
  .tt-top { display: flex; align-items: center; gap: 8px 12px; min-width: 0; flex-wrap: wrap; }
  .tt-top > .grow { min-width: 0; }
  .tt-h { margin: 0; font-family: var(--hand); font-size: clamp(26px, 3vw, 34px); letter-spacing: 1px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tt-spark { width: 26px; height: 26px; object-fit: contain; transform: translateY(-8px) rotate(12deg); }
  .tt-modes { display: flex; gap: 8px; flex-shrink: 0; }
  .tt-mode { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 8px; border-radius: 999px; background: #FFFDF7; border: 2px solid #CDBBA4; box-shadow: 0 3px 0 rgba(94,69,53,.12); font-family: var(--hand); font-size: 16px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .tt-mode img { width: 26px; height: 26px; object-fit: contain; }
  .tt-mode .tt-mi { font-size: 19px; width: 26px; text-align: center; }
  .tt-mode small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  .tt-mode.on { background: var(--sage-pale); border-color: #2E2620; }
  .tt-mode.on.tpl { background: var(--butter-pale); }
  .tt-status { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 7px 18px 7px 12px; border-radius: 999px; background: #FFFDF7; border: 2.5px solid #2E2620; box-shadow: 0 4px 0 rgba(94,69,53,.18); font-size: 15px; color: var(--ink); white-space: nowrap; flex: 0 1 auto; min-width: 0; }
  .tt-status .tt-st { overflow: hidden; text-overflow: ellipsis; }

  /* ===== 마을 배경: 사계절 × 낮/저녁 ===== */
  .scene { container-type: size; }
  .eve-tint, .eve-lights, .eve-stars, .fx { position: absolute; inset: 0; pointer-events: none; }
  .eve-tint, .eve-lights, .eve-stars { opacity: 0; transition: opacity 1.6s ease; }
  .scene.tod-evening .eve-tint, .scene.tod-evening .eve-lights, .scene.tod-evening .eve-stars { opacity: 1; }
  /* 저녁: 투명한 노을빛 + 연보라 조명 (원본 위에 얇게) */
  .eve-tint::before { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply;
    background: linear-gradient(180deg, rgba(150,130,215,.55) 0%, rgba(205,165,215,.38) 32%, rgba(225,180,200,.30) 55%, rgba(150,130,205,.45) 100%); }
  .eve-tint::after { content: ""; position: absolute; inset: 0; mix-blend-mode: soft-light;
    background: radial-gradient(ellipse 90% 45% at 50% 28%, rgba(255,160,120,.55), transparent 70%), linear-gradient(180deg, rgba(255,150,170,.25), rgba(120,100,200,.25)); }
  /* 창문·가로등 불빛 */
  .glow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; mix-blend-mode: screen; }
  .glow.win { width: 5.2%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,226,150,.95) 0, rgba(255,196,110,.55) 30%, rgba(255,170,100,.18) 55%, transparent 72%); }
  .glow.lamp { width: 3.6%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,240,180,1) 0, rgba(255,214,120,.6) 28%, rgba(255,190,110,.18) 55%, transparent 72%); }
  .anim-on .glow { animation: glowPulse 5.5s ease-in-out var(--dl) infinite alternate; }
  @keyframes glowPulse { 0% { opacity: .78; } 100% { opacity: 1; } }
  /* 별 */
  .star { position: absolute; width: 1%; aspect-ratio: 1; transform: translate(-50%, -50%) scale(var(--s)); }
  .star::before, .star::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, #fff 0 18%, rgba(255,250,220,.6) 30%, transparent 62%); }
  .star::after { inset: -60% 42%; background: linear-gradient(transparent, rgba(255,255,240,.95), transparent); box-shadow: none; }
  .star::before { box-shadow: 0 0 6px 1px rgba(255,248,220,.8); border-radius: 50%; }
  .anim-on .star { animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: translate(-50%, -50%) scale(calc(var(--s) * .7)); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(var(--s)); } }
  /* 계절 움직임: 떨어지는 꽃잎·낙엽·눈송이, 여름 반짝임 */
  .fx { overflow: hidden; }
  .fx .p { position: absolute; top: -4%; will-change: transform; animation: fxFall var(--d) linear var(--dl) infinite; }
  .fx .p b { display: block; will-change: transform; animation: fxSway var(--sd) ease-in-out var(--dl) infinite alternate; }
  @keyframes fxFall { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, 108cqh, 0); } }
  @keyframes fxSway { from { transform: translateX(0) rotate(0deg) scale(var(--s)); } to { transform: translateX(var(--sw)) rotate(220deg) scale(var(--s)); } }
  .fx-spring b { width: 16px; height: 12px; border-radius: 80% 0 80% 0; background: radial-gradient(circle at 30% 30%, #FFF0F4, #F49AB6 75%); box-shadow: 0 1px 2px rgba(190,90,120,.35); opacity: .95; }
  .fx-autumn b { width: 16px; height: 16px; border-radius: 0 85% 0 85%; background: hsl(calc(10 + var(--h) * 32), 85%, 58%); box-shadow: inset -2px -2px 0 rgba(120,50,20,.18); opacity: .92; }
  .fx-winter b { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.9); opacity: .9; }
  .fx-winter .p b { animation-name: fxSnow; }
  @keyframes fxSnow { from { transform: translateX(0) scale(var(--s)); } to { transform: translateX(var(--sw)) scale(var(--s)); } }
  .fx .p.tw { top: auto; animation: none; }
  .fx-summer .tw b { width: 14px; height: 14px; animation: fxSpark var(--d) ease-in-out var(--dl) infinite;
    background: radial-gradient(circle, #fff 0 14%, rgba(255,255,210,.0) 40%), linear-gradient(90deg, transparent 44%, rgba(255,255,235,.95) 50%, transparent 56%), linear-gradient(0deg, transparent 44%, rgba(255,255,235,.95) 50%, transparent 56%); }
  @keyframes fxSpark { 0%, 100% { opacity: 0; transform: scale(calc(var(--s) * .3)) rotate(0deg); } 50% { opacity: 1; transform: scale(var(--s)) rotate(45deg); } }
  .scene.tod-evening .fx-winter b { box-shadow: 0 0 8px rgba(230,220,255,.9); }
  /* 화면이 숨겨지면 멈춤 · 끄기 · 동작 줄이기 */

// 11월 둘째 주 일정(사용자가 고친 내용 포함)을 기본 시간표로 만들고, 다음 주부터 날짜마다 한 번씩 채워 넣음
const TPL_ID = "template-v1";
const dowOf = date => (parseYmd(date).getDay() + 6) % 7;   // 0=월 … 6=일
const TPL_FIELDS = ["name", "category", "start", "end", "durationMin", "charId", "needsReview"];
function ensureTemplate(){
  if (state.imports.includes(TPL_ID)) return false;
  if (!state.template.length) {
    state.plans.filter(p => p.source === SEED_ID).forEach(p => {
      const t = { id: uid(), dow: dowOf(p.date) };
      TPL_FIELDS.forEach(k => t[k] = p[k] ?? null);
      t.needsReview = !!p.needsReview;
      state.template.push(t);
      p.templateId = t.id;
    });
  }
  state.templateFrom = state.templateFrom || "2026-11-08";
  Object.values(SEED.dates).forEach(d => { if (!state.filledDates.includes(d)) state.filledDates.push(d); });
  state.imports.push(TPL_ID);

}
function planFromTemplate(t, date){
  const p = { id: uid(), date, status: "planned", recordId: null, memo: "", source: "template", templateId: t.id, ts: Date.now() };
  TPL_FIELDS.forEach(k => p[k] = t[k] ?? null);

// 보이는 날짜(이번 주·보고 있는 주)에 기본 시간표를 채움. 한 번 채운 날은 다시 채우지 않음(지운 일정이 되살아나지 않게)
function fillFromTemplate(dates){
  if (!state.templateFrom) return false;
  const limit = (() => { const d = new Date(); d.setDate(d.getDate() + 70); return ymd(d); })();
  let changed = false;
  dates.forEach(date => {
    if (date < state.templateFrom || date > limit || state.filledDates.includes(date)) return;
    state.template.filter(t => t.dow === dowOf(date)).forEach(t => state.plans.push(planFromTemplate(t, date)));
    state.filledDates.push(date); changed = true;
  });
  return changed;
}
// 기본 시간표를 바꾸면: 오늘 이후, 아직 계획 상태이고 따로 고치지 않은 일정에도 반영
function syncTemplate(t, removed){
  const today = todayStr();
  const target = p => p.templateId === t.id && p.date >= today && p.status === "planned" && !p.custom;
  if (removed) { state.plans = state.plans.filter(p => !target(p)); return; }
  const have = new Set();
  state.plans.forEach(p => {
    if (p.templateId !== t.id || p.date < today) return;
    have.add(p.date);
    if (target(p)) {
      if (dowOf(p.date) !== t.dow) { p._drop = true; have.delete(p.date); return; }
      TPL_FIELDS.forEach(k => p[k] = t[k] ?? null); p.needsReview = !!t.needsReview;
    }
  });
  state.plans = state.plans.filter(p => !p._drop);
  state.filledDates.filter(d => d >= today && dowOf(d) === t.dow && !have.has(d)).forEach(d => state.plans.push(planFromTemplate(t, d)));
}
// 기본 정의 + 사용자가 바꾼 이름·목표

/* ============ 저장 ============ */
const Store = {
  ref: null, writing: false, dirty: false, mode: "local",
  async init(){
    let local = null;
    try { const raw = localStorage.getItem(KEY); if (raw) local = normalize(JSON.parse(raw)); } catch(e){}
    if (local) state = local;
    render();
    try {
      if (!window.claude || typeof claude.use !== "function") return;
      const db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.collection("data/users/" + id).doc("tamagotchi-v2");
      const d = unwrap(await withTimeout(this.ref.get(), 10000));
      this.mode = "cloud";
      if (d && d.state) {
        const remote = normalize(JSON.parse(d.state));
        if (!local || remote.updatedAt >= local.updatedAt) { state = remote; saveLocal(); } else this.push();
      } else if (local) this.push();
      render();
    } catch(e) { console.warn("db unavailable", e); this.ref = null; this.mode = "local"; render(); }
  },
  save(){ state.updatedAt = Date.now(); saveLocal(); this.push(); },
  async push(){
    if (!this.ref) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    try { await this.ref.set({ state: JSON.stringify(state), updatedAt: state.updatedAt }); } catch(e){ console.warn("save failed", e); }
    this.writing = false;
    if (this.dirty) { this.dirty = false; this.push(); }
  }
};
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function unwrap(s){ if (!s || s.exists === false) return null; return typeof s.data === "function" ? s.data() : s; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]); }

/* ============ 계산 ============ */
function recsOf(id){ return state.records.filter(r => r.charId === id); }
function minOn(id, date){ return recsOf(id).filter(r => r.date === date).reduce((a,r) => a + r.minutes, 0); }
function minWeek(id, monday){ const days = new Set(weekDays(monday)); return recsOf(id).filter(r => days.has(r.date)).reduce((a,r) => a + r.minutes, 0); }
// 경험치: 1분 = 1XP / 하루 목표 달성일 +20 / 주간 목표 달성 주 +100
function xpOf(id){
  const c = ch(id); let xp = 0; const byDay = {}, byWeek = {};
  for (const r of recsOf(id)) {
    xp += r.minutes;
    byDay[r.date] = (byDay[r.date] || 0) + r.minutes;
    const w = ymd(mondayOf(parseYmd(r.date))); byWeek[w] = (byWeek[w] || 0) + r.minutes;
  }
  if (isCount(c)) {
    // 횟수 목표: 목표를 채운 주마다 +100
    const weeks = new Set([...recsOf(id).map(r => r.date), ...(id === "reels" ? R().posts.map(p => p.date) : [])].map(d => ymd(mondayOf(parseYmd(d)))));
    weeks.forEach(w => { if (countIn(id, weekDays(parseYmd(w))) >= weeklyCountTarget(c)) xp += 100; });
  } else {
    for (const d in byDay) if (byDay[d] >= c.dailyGoal) xp += 20;
    for (const w in byWeek) if (byWeek[w] >= c.weeklyGoal) xp += 100;
  }
  return Math.floor(xp);
}
function levelInfo(xp){ let lvl = 1, need = 60, rem = xp; while (rem >= need) { rem -= need; lvl++; need = 60 + (lvl-1) * 30; } return { level: lvl, cur: rem, need }; }
function stageOf(l){

/* ===== 목표: 시간(하루 분·주 시간) 또는 횟수(주당 N회) ===== */
const isCount = c => c.goalType === "count";

// 횟수: 릴스는 업로드 수, 나머지는 기록 횟수
function countIn(id, days){ const set = new Set(days); return id === "reels" ? R().posts.filter(p => set.has(p.date)).length : recsOf(id).filter(r => set.has(r.date)).length; }

  const monday = mondayOf(parseYmd(date)), days = weekDays(monday);
  if (isCount(c)) {

    return { count: true, n, t, pct: Math.min(1, n / t), done: n >= t, today: countIn(c.id, [date]),

/* 스킬 나이: 시작한 날부터 */
function ageOf(c, today = todayStr()){
  if (!c.startDate || c.startDate > today) return null;
  const a = parseYmd(c.startDate), t = parseYmd(today);

  if (m < 0) { y--; m += 12; }
  const days = Math.round((t - a) / 86400000) + 1;   // 시작한 날 = 1일째
  const label = y > 0 ? (m ? `${y}살 ${m}개월` : `${y}살`) : m > 0 ? `${m}개월` : `${days}일`;
  const birthday = today !== c.startDate && t.getMonth() === a.getMonth() && t.getDate() === a.getDate();

/* 캐릭터 기분 → 포즈 */
function moodOf(id){
  const c = ch(id), today = todayStr(), hour = new Date().getHours();

  const last = recs.reduce((m, r) => r.date > m ? r.date : m, "");
  const gap = last ? daysBetween(last, today) : null;
  if (timerOf(id)) return { pose: "focus", text: "집중하는 중… 🔥" };
  if (!recs.length) return { pose: "hi", text: `같이 ${c.skill} ${c.verb} 시작해볼까?` };
  const gn = goalNow(c);
  if (gn.count ? gn.done && t > 0 : gn.done) return { pose: pick(["done1","done2","done3"]), text: gn.count ? "이번 주 목표 달성! 최고야 ✨" : "오늘 목표 달성! 최고야 ✨" };

  if (t > 0) return { pose: "base", text: "조금만 더 하면 목표야!" };
  if (hour >= 23 || hour < 6) return { pose: "sleep", text: "쿨쿨… 내일 만나…" };
  if (gap >= 3) return { pose: "cry", text: `${gap}일이나 못 봤어… 😢` };

  document.querySelectorAll("[data-le-mode]").forEach(c => c.onclick = () => { ui.lightEditMode = c.dataset.leMode; render(); });
  document.getElementById("le-done").onclick = e => { e.stopPropagation(); ui.lightEdit = false; document.body.classList.remove("light-editing"); ui.tab = "set"; render(); };
  document.getElementById("le-reset").onclick = e => { e.stopPropagation(); delete scenePref().lights; delete scenePref().stars; Store.save(); render(); };
  sc.onclick = e => {
    const r = sc.getBoundingClientRect(), x = +((e.clientX - r.left) / r.width * 100).toFixed(2), y = +((e.clientY - r.top) / r.height * 100).toFixed(2);
    const li = e.target.closest("[data-li]"), si = e.target.closest("[data-si]");
    if (li) { const a = [...sceneLights()]; a.splice(+li.dataset.li, 1); scenePref().lights = a; }

    Store.save(); render();
  };
}

function fitHomeScene(){
  const w = document.getElementById("scene-wrap"), sc = document.getElementById("scene"), dock = document.getElementById("dock");
  if (!w || !sc) return;
  const H = sc.clientHeight, maxY = w.scrollHeight - w.clientHeight;
  const panelTop = dock ? dock.getBoundingClientRect().top : innerHeight;
  const low = Math.max(...allChars().map(c => c.y)) / 100 * H + 14;
  let y = maxY / 2;
  if (low - y > panelTop - 6) y = low - (panelTop - 6);
  w.scrollTop = Math.max(0, Math.min(maxY, y));
  w.scrollLeft = (w.scrollWidth - w.clientWidth) / 2;
}

const KO_STOP = new Set("오늘 어제 내일 그리고 그래서 그런데 하지만 그러나 그냥 너무 정말 진짜 완전 조금 많이 다시 이제 아직 계속 항상 그런 이런 저런 이렇게 그렇게 저렇게 하는 하고 해서 했다 했는데 했고 했어 한다 하는데 있다 있는 있었다 있어서 없다 없는 같다 같은 같아 것 거 게 수 때 좀 더 잘 안 못 뭐 왜 나는 내가 나도 나의 저는 제가 우리 우리는 너무나 정도 생각 시간 하루 이번 지금 그때 때문 때문에 위해 그것 이것 저것 여기 거기 뭔가 누가 어떤 모든 모두 다른 같이 함께 또 및 등 오전 오후 아침 저녁 밤 낮 주일 요일 일기 다음 하나 두 세".split(" "));
const KO_JOSA = /(으로써|으로서|에서는|에게서|까지는|부터는|이라고|라고|이랑|에서|에게|한테|까지|부터|처럼|보다|으로|하고|이나|이며|이고|는데|지만|은|는|이|가|을|를|에|의|도|로|와|과|랑|만|요)$/;
const MOOD_POS = ["행복", "좋았", "좋아", "감사", "기뻤", "기쁘", "즐거", "즐겁", "뿌듯", "설렜", "설레", "웃", "신났", "재밌", "재미있", "편안", "고마", "사랑", "성공", "평안", "은혜"];
const MOOD_NEG = ["힘들", "피곤", "슬펐", "슬프", "속상", "짜증", "우울", "걱정", "불안", "아팠", "아프", "지쳤", "지친", "화나", "화났", "외로", "후회", "실수", "답답", "무기력"];
const DATE_RE = /^\s*(?:\d{4}[.\-/년]\s*)?(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?\s*(?:\(?[월화수목금토일](?:요일)?\)?)?\s*[:：\-–]?\s*(.*)$|^\s*\(?([월화수목금토일])요일\)?\s*[:：\-–]?\s*(.*)$/;

function diarySummary(raw, weekDaysArr){
  const text = String(raw || "").replace(/\r/g, "").trim();
  if (!text) return null;
  // 1) 날짜(11/16, 11월 16일, 월요일 …)로 나누기
  const entries = []; let cur = null;
  text.split("\n").forEach(line => {
    const m = line.match(DATE_RE);
    if (m && line.trim().length <= 40 + (m[3] || m[5] || "").length) {
      let label;
      if (m[1]) label = `${+m[1]}월 ${+m[2]}일`;
      else { const i = "월화수목금토일".indexOf(m[4]); label = weekDaysArr && i >= 0 ? `${fmtMD(weekDaysArr[i])} (${m[4]})` : `${m[4]}요일`; }
      cur = { label, lines: [] }; entries.push(cur);
      const rest = (m[3] ?? m[5] ?? "").trim(); if (rest) cur.lines.push(rest);
    } else if (line.trim()) { if (!cur) { cur = { label: null, lines: [] }; entries.push(cur); } cur.lines.push(line.trim()); }
  });
  const sentences = s => s.split(/(?<=[.!?~。]|[다요죠네]\s)\s+|\n/).map(x => x.trim()).filter(x => x.length >= 4);
  const firstLine = e => { const s = sentences(e.lines.join(" "))[0] || e.lines[0] || ""; return s.length > 60 ? s.slice(0, 58) + "…" : s; };
  // 2) 자주 나온 낱말 (조사 떼고, 흔한 말 빼고)
  const freq = new Map();
  (text.match(/[가-힣A-Za-z]{2,}/g) || []).forEach(w0 => {
    let w = w0; for (let k = 0; k < 2; k++) { const s2 = w.replace(KO_JOSA, ""); if (s2.length >= 2) w = s2; }
    if (w.length < 2 || KO_STOP.has(w) || /^(했|하|있|없|같|되|된|될|싶|않|봤|보|갔|왔)/.test(w) && w.length <= 3) return;
    freq.set(w, (freq.get(w) || 0) + 1);
  });
  const words = [...freq.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 10);
  // 3) 마음 날씨: 좋은 말 / 힘든 말 세기
  const cnt = list => list.reduce((a, w) => a + (text.split(w).length - 1), 0);
  const pos = cnt(MOOD_POS), neg = cnt(MOOD_NEG);
  const mood = pos + neg === 0 ? { ic: "🌤", t: "잔잔한 한 주" } : pos >= neg * 2 ? { ic: "☀️", t: "맑은 한 주" } : neg >= pos * 2 ? { ic: "🌧", t: "조금 지친 한 주" } : { ic: "⛅", t: "맑았다 흐렸다 한 주" };
  // 4) 감사·좋았던 문장, 일기에 나온 스킬
  const all = sentences(text);
  const good = all.filter(s => /감사|고마|좋았|행복|뿌듯|기뻤|은혜/.test(s)).slice(0, 3).map(s => s.length > 70 ? s.slice(0, 68) + "…" : s);
  const skills = pickableChars().map(c => ({ c, n: [c.skill, c.name, ...(c.id === "drum" ? ["찬양", "합주", "스틱"] : c.id === "jp" ? ["단어", "JLPT", "일어"] : c.id === "reels" ? ["촬영", "편집", "업로드"] : c.id === "toon" ? ["그림", "컷"] : [])].reduce((a, w) => a + (w ? text.split(w).length - 1 : 0), 0) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  return { entries: entries.map(e => ({ label: e.label, line: firstLine(e) })).filter(e => e.line), words, mood, pos, neg, good, skills, chars: text.replace(/\s/g, "").length };
}

function weekReport(monday){
  const days = weekDays(monday), prevMon = mondayOf(parseYmd(days[0])); prevMon.setDate(prevMon.getDate() - 7);
  const prevDays = weekDays(prevMon), set = new Set(days);
  const chars = allChars().map(c => {
    const mins = days.reduce((a, d) => a + minOn(c.id, d), 0), prev = prevDays.reduce((a, d) => a + minOn(c.id, d), 0);
    const cnt = isCount(c), n = cnt ? countIn(c.id, days) : mins, t = cnt ? weeklyCountTarget(c) : c.weeklyGoal;
    const best = days.map(d => [d, minOn(c.id, d)]).sort((a, b) => b[1] - a[1])[0];
    return { c, mins, prev, cnt, n, t, pct: Math.min(1, t ? n / t : 0), done: n >= t, best: best[1] ? best : null, daysOn: days.filter(d => minOn(c.id, d) > 0).length };
  });
  const total = chars.reduce((a, x) => a + x.mins, 0), prevTotal = chars.reduce((a, x) => a + x.prev, 0);
  const active = days.filter(d => state.records.some(r => r.date === d));
  const plans = state.plans.filter(p => set.has(p.date));
  const planDone = plans.filter(p => p.status === "done"), planMiss = plans.filter(p => p.status !== "done" && p.date < todayStr());
  const posts = R().posts.filter(p => set.has(p.date));
  const fw = R().followers.filter(f => f.date <= days[6]).sort((a, b) => a.date < b.date ? -1 : 1);
  const fwEnd = fw.filter(f => f.date >= days[0]).pop(), fwStart = fw.filter(f => f.date < days[0]).pop();
  const evs = days.flatMap(d => eventsOn(d).map(e => ({ d, e }))).filter((x, i, a) => a.findIndex(y => y.e.id === x.e.id) === i);
  const conti = W().sets.filter(s => set.has(wsSatOf(s)));
  const mvp = chars.filter(x => x.n > 0).sort((a, b) => b.pct - a.pct || b.mins - a.mins)[0];
  return { days, chars, total, prevTotal, active, plans, planDone, planMiss, posts, fwEnd, fwStart, evs, conti, mvp };
}

function startTimer(id, after){
  const go = () => { state.timer = { charId: id, startedAt: Date.now() }; Store.save(); render(); after && after(); };
  if (state.timer && state.timer.charId !== id) {
    const o = ch(state.timer.charId);
    confirmModal(`${o.name}의 ${o.skill} 타이머가 켜져 있어요. 먼저 끝내고 기록할까요?`, "끝내고 기록", () => stopTimer(), o.id, "think");
    return;
  }
  go();
}
function stopTimer(){
  const t = state.timer; if (!t) return;
  const c = ch(t.charId);
  const mins = Math.max(0, Math.round((Date.now() - t.startedAt) / 60000));
  const date = ymd(new Date(t.startedAt));

      <p class="muted">시간이 다르면 고쳐주세요 (${fmtMD(date)})</p>
      ${durInputHTML(mins)}
      <input type="text" id="st-memo" maxlength="60" placeholder="메모 (선택)" style="margin-top:8px">
      <div class="err" id="st-err"></div>
      <div class="actions"><button class="btn-ghost" id="st-cancel">기록 안 하고 끄기</button><button class="btn-primary" id="st-save">기록하기</button></div>
    </div>`, { bare: true });
  bindDurInput();
  document.getElementById("st-cancel").onclick = () => { state.timer = null; Store.save(); close(); render(); };
  document.getElementById("st-save").onclick = () => {
    const m = readDur(); if (!(m > 0)) { document.getElementById("st-err").textContent = "1분 이상이어야 기록돼요."; return; }
    const memo = document.getElementById("st-memo").value.trim();
    state.timer = null; close();
    const st0 = new Date(t.startedAt);
    addRecord(c.id, m, date, memo, "timer", { start: `${pad(st0.getHours())}:${pad(st0.getMinutes())}` });
  };
}

/* ============ 시간 직접 입력 ============ */
function durInputHTML(mins){
  return `<div class="dur">
    <button type="button" data-d="-60" aria-label="1시간 빼기">−</button><input type="number" id="d-h" min="0" max="23" inputmode="numeric" value="${Math.floor(mins/60)}"><span class="u">시간</span>
    <input type="number" id="d-m" min="0" max="59" inputmode="numeric" value="${mins%60}"><span class="u">분</span><button type="button" data-d="60" aria-label="1시간 더하기">＋</button>
  </div>
  <div class="row" style="justify-content:center">${[10,30,60].map(n => `<span class="chip" data-d="${n}">+${fmtDur(n)}</span>`).join("")}<span class="chip" data-d="-10">−10분</span></div>`;
}
function readDur(){ return (Math.max(0, Number(document.getElementById("d-h").value) || 0)) * 60 + Math.max(0, Number(document.getElementById("d-m").value) || 0); }
function setDur(m){ m = Math.max(0, Math.min(24*60, m)); document.getElementById("d-h").value = Math.floor(m/60); document.getElementById("d-m").value = m % 60; }
function bindDurInput(){ document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => setDur(readDur() + Number(b.dataset.d))); }

/* ============ 기록 + 달성 팝업 ============ */
function addRecord(id, minutes, date, memo, source, extra = {}){
  const c = ch(id);
  const before = levelInfo(xpOf(id)).level, beforeXP = xpOf(id);
  const monday = mondayOf(parseYmd(date));
  const dayBefore = minOn(id, date), weekBefore = minWeek(id, monday);
  const born = !c.startDate;
  if (born) { state.chars[id] = { ...(state.chars[id] || {}), startDate: date }; c.startDate = date; }
  const hatchNow = born && isCustom(id) ? hatchCustom(id) : null;   // 꿈의 방 알 → 마을로
  state.records.push({ id: uid(), charId: id, date, minutes, memo, source, ts: Date.now(), ...extra });
  Store.save();

  const after = levelInfo(xpOf(id)).level, gained = xpOf(id) - beforeXP;
  const day = minOn(id, date), week = minWeek(id, monday);
  const cnt = isCount(c), gAfter = goalNow(c, date), cntBefore = cnt ? countIn(id, weekDays(monday)) - (id === "reels" ? 0 : 1) : 0;
  const dailyNew = !cnt && day >= c.dailyGoal && dayBefore < c.dailyGoal;
  const weeklyNew = cnt ? (gAfter.done && cntBefore < gAfter.t) : (week >= c.weeklyGoal && weekBefore < c.weeklyGoal);
  const pose = after > before ? "levelup" : weeklyNew ? "weekly" : dailyNew ? "done1" : "eat";
  talkReact(id, { minutes, dailyNew, weeklyNew, levelUp: after > before, born });
  const when = date === todayStr() ? "오늘은" : `${fmtMD(date)}에는`;
  const lines = [
    `➕ 방금 ${fmtDur(minutes)} 기록했어요`,
    ...(cnt ? [`🎯 ${gAfter.label}${weeklyNew ? " · 주간 목표 달성! 🎉" : gAfter.done ? " · 이미 달성" : ` · ${gAfter.left}`}`, ...(id === "reels" ? ["🎬 업로드 횟수는 릴스 스튜디오의 업로드 기록으로 세요"] : [])]
      : [day >= c.dailyGoal ? `🎯 하루 목표 ${fmtDur(c.dailyGoal)} ${dailyNew ? "달성!" : "이미 달성"}` : `🌱 하루 목표까지 ${fmtDur(c.dailyGoal - day)} 남았어요`,
         `📅 이번 주 ${fmtDur(week)} / ${fmtDur(c.weeklyGoal)}${weeklyNew ? " · 주간 목표 달성! 🎉" : ""}`]),
  ];
  let lv = hatchNow ? `<div class="levelup">🐣 ${esc(callName(c.name))}가 알에서 깨어났어요!<br><span style="font-size:16px">🏡 마을 ${esc(hatchNow.spot || "")}로 이사 갔어요 · ${esc(c.skill)} 시작한 날 ${fmtMD(date)}</span><br><button class="btn-sm" id="hatch-go" style="margin-top:8px">🏡 마을에 가보기</button></div>`
    : born ? `<div class="levelup">🐣 ${esc(callName(c.name))}가 태어났어요!<br><span style="font-size:16px">${esc(c.skill)} 시작한 날: ${fmtMD(date)}</span></div>` : "";
  if (after > before) {
    const s0 = stageOf(before), s1 = stageOf(after);
    lv += `<div class="levelup">⬆️ ${esc(callName(c.name))}가 Lv.${after}로 자랐어요!${s0.key !== s1.key ? `<br>🌱 ${s1.label} 단계가 되었어요` : ""}</div>`;
  }
  ui.selectedDate = date;
  render();
  openModal(`<div class="pop-c" style="${charStyle(c)}">
    <div class="hero ${hatchNow ? "hatching" : ""}"><span class="prop">${c.prop}</span><img src="${SP(id, pose)}" alt="">${hatchNow ? `<img class="hatch-shell" src="${eggSrc(c)}" alt="">` : ""}</div>
    <div class="big">${esc(when)} ${esc(josa(c.skill, "을", "를"))}<br><em>${fmtDur(day)}</em> ${c.verb}했어요</div>
    <div class="lines">${lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>
    <span class="xp-chip">+${gained} XP</span>${lv}
  </div>`, { okLabel: pick(["좋아!", "고마워!", "계속 할래!"]) });
  if (dailyNew || weeklyNew || after > before) floaties(lastModal()?.querySelector(".hero"), weeklyNew ? "💕" : "✨");
  if (hatchNow) {
    setTimeout(() => floaties(lastModal()?.querySelector(".hero"), "🎉"), 900);
    const go = lastModal()?.querySelector("#hatch-go");
    if (go) go.onclick = () => { document.querySelectorAll("#modal-root .overlay").forEach(o => o.remove()); ui.tab = "home"; ui.scroll = null; render(); };
  }
}

/* --- 주간 시간표 (요일 × 시간) --- */
const DOW_EN = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const TT_ROW = 46;
function ttWeek(){ const m = mondayOf(new Date()); m.setDate(m.getDate() + ui.weekOffset * 7); return weekDays(m); }
function ttRange(plans){
  let lo = 9, hi = 22;
  plans.forEach(p => { const a = toMin(p.start), b = toMin(p.end) ?? (a != null && p.durationMin ? a + p.durationMin : null);
    if (a != null) lo = Math.min(lo, Math.floor(a / 60)); if (b != null) hi = Math.max(hi, Math.ceil(b / 60)); });
  return [Math.max(0, lo), Math.min(24, hi)];
}
function ttSpan(p){ const a = toMin(p.start); if (a == null) return null; const b = toMin(p.end) ?? (p.durationMin ? a + p.durationMin : a + 60); return [a, Math.max(b, a + 20)]; }
// 겹치는 일정은 나란히
function ttLanes(items){
  const lanes = []; items.sort((x, y) => x.span[0] - y.span[0]);
  items.forEach(it => { let i = lanes.findIndex(end => end <= it.span[0]); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = it.span[1]; it.lane = i; });
  items.forEach(it => { it.lanes = Math.max(1, ...items.filter(o => o.span[0] < it.span[1] && o.span[1] > it.span[0]).map(o => o.lane + 1)); });
  return items;
}

// 시간표 위 상태 알약: 지금 일정 > 다음 일정 > 자유 시간
function ttStatusHTML(){

function bindTimetable(){
  const tpl = ui.ttMode === "tpl";
  document.querySelectorAll("[data-ttmode]").forEach(b => b.onclick = () => { ui.ttMode = b.dataset.ttmode; render(); });
  if (!tpl) {
    document.getElementById("tt-prev").onclick = () => { ui.weekOffset--; render(); };
    document.getElementById("tt-next").onclick = () => { if (ui.weekOffset < 8) { ui.weekOffset++; render(); } };
    const tb = document.getElementById("tt-today"); if (tb) tb.onclick = () => { ui.weekOffset = 0; render(); };
    const st = document.getElementById("tt-status"); if (st) st.onclick = () => { if (ui.weekOffset) { ui.weekOffset = 0; render(); } ttScrollNow(true); };
  } else document.getElementById("tt-ics").onclick = exportICS;

  document.querySelectorAll("[data-tpl]").forEach(b => b.onclick = e => { e.stopPropagation(); openTemplateForm(b.dataset.tpl); });
  const lo = (() => { const items = tpl ? state.template : state.plans.filter(p => ttWeek().includes(p.date)); return ttRange(items)[0]; })();
  const slot = key => key.startsWith("dow:") ? { dow: Number(key.slice(4)) } : { date: key };
  document.querySelectorAll("[data-col]").forEach(col => col.onclick = e => {
    if (e.target !== col) return;
    const h = Math.min(23, lo + Math.floor(e.offsetY / TT_ROW));
    const pre = { ...slot(col.dataset.col), start: `${pad(h)}:00`, end: h >= 23 ? "23:59" : `${pad(h + 1)}:00` };
    tpl ? openTemplateForm(null, pre) : openPlanForm(null, pre);
  });
  document.querySelectorAll("[data-add-day]").forEach(c => c.onclick = e => { if (e.target !== c) return; const pre = slot(c.dataset.addDay); tpl ? openTemplateForm(null, pre) : openPlanForm(null, pre); });
  const sc = document.querySelector(".tt-scroll"), td = document.querySelector(".tt-dh.today");
  if (sc && td && sc.scrollWidth > sc.clientWidth) sc.scrollLeft = Math.max(0, td.offsetLeft - 60);
  if (!tpl && ui.ttScrolled !== ui.weekOffset) { ui.ttScrolled = ui.weekOffset; ttScrollNow(false); }
}
// 표 안에서 지금 시각(빨간 선)이 보이게 스크롤
function ttScrollNow(smooth){
  const sc = document.querySelector(".tt-scroll"), now = document.querySelector(".tt-now");
  if (!sc || !now || sc.scrollHeight <= sc.clientHeight) return;
  const y = now.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - sc.clientHeight * .35;
  sc.scrollTo({ top: Math.max(0, y), behavior: smooth ? "smooth" : "auto" });
}

      state.template = state.template.filter(x => x.id !== t.id); syncTemplate(t, true); Store.save(); render(); }, "toon", "think"); };
    box.querySelector("#tf-save").onclick = () => {
      const f = read(), err = box.querySelector("#tf-err");
      if (!f.name.trim()) { err.textContent = "무엇을 하는지 적어주세요."; return; }
      if (f.start && f.end && toMin(f.end) <= toMin(f.start)) { err.textContent = "끝나는 시간이 시작보다 늦어야 해요."; return; }
      const data = { name: f.name.trim(), dow, start: f.start || null, end: f.end || null, durationMin: Number(f.dur) > 0 ? Math.round(Number(f.dur)) : null, category: cat, charId };

      if (t) { Object.assign(t, data); if (t.needsReview && f.reviewed) t.needsReview = false; }
      else { item = { id: uid(), ...data, needsReview: false }; state.template.push(item); }
      syncTemplate(item, false);
      Store.save(); close(); render();
    };
  };
  draw();
}

/* --- 아이패드 캘린더 알림(.ics): 앱을 꺼둬도 시작 시간에 알림 --- */
function exportICS(){
  const items = state.template.filter(t => t.start);
  if (!items.length) { openModal(`<p>시간이 정해진 기본 일정이 없어요.</p>`); return; }
  const z = n => String(n).padStart(2, "0");
  const stamp = (() => { const d = new Date(); return `${d.getUTCFullYear()}${z(d.getUTCMonth()+1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}00Z`; })();
  const nextDate = dow => { const d = new Date(); d.setHours(0,0,0,0); while ((d.getDay() + 6) % 7 !== dow) d.setDate(d.getDate() + 1); return d; };
  const fmt = (d, hm) => `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${hm.replace(":", "")}00`;
  const escI = t => String(t).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//growth-tamagotchi//KO", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:다마고치 시간표",
    "BEGIN:VTIMEZONE", "TZID:Asia/Seoul", "BEGIN:STANDARD", "DTSTART:19700101T000000", "TZOFFSETFROM:+0900", "TZOFFSETTO:+0900", "TZNAME:KST", "END:STANDARD", "END:VTIMEZONE"];
  items.forEach(t => {
    const d = nextDate(t.dow), endHM = t.end || (() => { const m = toMin(t.start) + (t.durationMin || 60); return `${z(Math.min(23, Math.floor(m/60)))}:${z(m%60)}`; })();
    lines.push("BEGIN:VEVENT", `UID:tamagotchi-${t.id}@growth-tamagotchi`, `DTSTAMP:${stamp}`,
      `DTSTART;TZID=Asia/Seoul:${fmt(d, t.start)}`, `DTEND;TZID=Asia/Seoul:${fmt(d, endHM)}`, "RRULE:FREQ=WEEKLY",
      `SUMMARY:${escI(t.name)}`, `DESCRIPTION:${escI("지금은 " + t.name + " 시간이에요 🌱")}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT0M", `DESCRIPTION:${escI("지금은 " + t.name + " 시간이에요")}`, "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "다마고치-시간표.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  openModal(`<div class="pop-c"><div class="hero"><img src="${SP("toon","hi")}" alt="" style="width:100px;height:100px"></div>
    <div class="big" style="font-size:22px">캘린더 파일을 만들었어요</div>
    <div class="lines"><p>1. 뜨는 화면에서 <b>모두 추가</b>를 누르면 아이패드 캘린더에 매주 반복 일정 ${items.length}개가 들어가요.</p>
    <p>2. 시작 시간마다 알림이 와요. 앱을 꺼둬도 와요.</p>
    <p>3. 안 열리면 <b>파일</b> 앱의 다운로드에서 파일을 눌러주세요.</p>
    <p class="muted">기본 시간표를 바꾸면 캘린더 일정은 직접 고치거나 다시 만들어야 해요.</p></div></div>`);
}

/* --- 달력: 한 달 기록만 간단하게 --- */
// 기록이 언제였는지: 직접 적은 시작 시간 > 완료한 일정의 시간 > 타이머 끝난 시각
function recSpan(r){
  let a = toMin(r.start);
  if (a == null && r.planId) { const p = state.plans.find(x => x.id === r.planId); if (p) a = toMin(p.start); }
  if (a == null && r.source === "timer" && r.ts && ymd(new Date(r.ts)) === r.date) { const e = new Date(r.ts); a = e.getHours() * 60 + e.getMinutes() - r.minutes; }
  if (a == null) return null;
  a = Math.max(0, a);
  return [a, Math.min(24 * 60, a + Math.max(r.minutes, 15))];
}
const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
function monthDays(offset){
  const n = new Date(), first = new Date(n.getFullYear(), n.getMonth() + offset, 1);
  const start = mondayOf(first), last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const days = []; const d = new Date(start);
  while (d <= last || days.length % 7) { days.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return { first, days };
}

        state.plans.forEach(p => { if (p.recordId === r.id) { p.recordId = null; p.status = "planned"; } });
        Store.save(); render(); draw();
      } else { b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 삭제"; }
    });
  };
  draw();
}

      <label for="pf-memo">메모 (선택)</label>

  };

}

/* --- 일정 완료 체크 → 실제 기록(경험치는 여기서만) --- */
function togglePlan(id){
  const p = state.plans.find(x => x.id === id);
  if (p.status === "done") {
    const rec = p.recordId && state.records.find(r => r.id === p.recordId);
    confirmModal(rec ? `완료를 취소할까요? 함께 남긴 ${ch(rec.charId).skill} 기록 ${fmtDur(rec.minutes)}과 경험치도 빠져요.` : "완료를 취소할까요?", "완료 취소", () => {
      if (rec) state.records = state.records.filter(r => r.id !== rec.id);
      p.status = "planned"; p.recordId = null; Store.save(); render();
    }, rec ? rec.charId : "toon", "think");
    return;
  }
  if (p.date > todayStr()) { openModal(`<div class="pop-c"><div class="hero"><img src="${SP("toon","think")}" alt="" style="width:110px;height:110px"></div><p style="font-size:16px">아직 오지 않은 날이에요.<br>그날이 되면 완료를 체크할 수 있어요.</p></div>`); return; }
  let sel = p.charId || suggestChar(p);
  const mins0 = planMinutes(p) || 30;
  const close = openModal("", { bare: true });
  const box = lastModal();
  const draw = keepMin => {
    const c = sel ? ch(sel) : null;
    box.innerHTML = `<div class="pop-c" style="${c ? charStyle(c) : ""}">
      <button class="close-x" data-close aria-label="닫기">✕</button>
      <div class="hero"><img src="${c ? SP(c.id, "eat") : SP("toon","hi")}" alt="" style="width:110px;height:110px"></div>
      <div class="big" style="font-size:22px">'${esc(p.name)}'<br>실제로 했나요?</div>
      ${p.needsReview ? `<p class="review-note">⚠️ 확인 필요한 일정이에요. <button class="rv-badge" id="tp-edit">내용 고치기</button></p>` : ""}
      <p class="muted" style="margin-bottom:6px">어떤 스킬로 기록할까요?</p>
      <div class="row" style="justify-content:center"><span class="chip ${!sel?"on":""}" data-s="">스킬 아님</span>${pickableChars().map(x => `<span class="chip ${x.id===sel?"on":""}" data-s="${x.id}" style="${x.id===sel?`background:${x.bg}`:""}"><span class="dot" style="background:${x.main}"></span>${esc(x.skill)}</span>`).join("")}</div>
      ${c ? `<p class="muted" style="margin-top:10px">실제로 ${esc(c.skill)} ${c.verb}한 시간</p>${durInputHTML(keepMin ?? mins0)}` : `<p class="muted" style="margin-top:10px">스킬이 아닌 일정은 완료 표시만 하고 경험치는 없어요.</p>`}
      <div class="err" id="tp-err"></div>
      <div class="actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="tp-save">완료했어요</button></div>
    </div>`;
    box.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    const ed = box.querySelector("#tp-edit"); if (ed) ed.onclick = () => { close(); openPlanForm(p.id); };
    if (c) bindDurInput();
    box.querySelectorAll("[data-s]").forEach(x => x.onclick = () => { const m = sel ? readDur() : undefined; sel = x.dataset.s || null; draw(m); });
    box.querySelector("#tp-save").onclick = () => {
      if (!sel) { p.status = "done"; p.recordId = null; Store.save(); close(); render(); return; }
      const m = readDur();
      if (!(m > 0)) { box.querySelector("#tp-err").textContent = "1분 이상 입력해 주세요."; return; }
      const rid = uid();
      p.status = "done"; p.recordId = rid; p.charId = sel;
      close();
      addRecord(sel, m, p.date, p.name, "plan", { id: rid, planId: p.id });
    };
  };
  draw();
}

function bindSettings(){

  const tas = document.getElementById("talk-api-save");
  if (tas) tas.onclick = async () => {
    const v = document.getElementById("talk-api").value.trim(), msg = document.getElementById("talk-api-msg");
    if (v && !/^https:\/\/[^\s]+$/.test(v)) { msg.textContent = "https:// 로 시작하는 주소를 넣어주세요."; return; }
    scenePref().talkApi = v || null; Store.save();
    if (!v) { msg.textContent = "준비된 대사로 말할게요."; return; }
    msg.textContent = "연결 확인 중…";
    const probe = { ev: "hello", t: esc("…왔냐. 기다린 건 아님."), facts: {} };
    const n = await aiRewrite([{ id: "jp", msg: probe }]);
    msg.textContent = n ? `연결됐어요 ✓ 모찌: "${plainText(probe.t)}"` : "저장했어요. 다만 지금은 서버 응답이 없어서 준비된 대사를 써요.";
  };
  document.querySelectorAll("[data-scene-bgm]").forEach(x => x.onclick = () => { scenePref().bgm = x.dataset.sceneBgm === "true"; Store.save(); bgmOn() ? bgmPlay() : bgmStop(); render(); });

/* ============ 🎬 릴스 스튜디오 (릴리) ============ */
const REEL_TYPES = ["제품 리뷰", "튜토리얼", "GRWM", "비포/애프터", "추천템", "일상", "기타"];
const STAGES = [ { k: "idea", label: "💡 아이디어" }, { k: "shoot", label: "🎥 촬영" }, { k: "edit", label: "✂️ 편집" }, { k: "done", label: "✅ 업로드" } ];
const R = () => state.reels;
const n0 = v => (v == null || v === "" || isNaN(v)) ? null : Number(v);
const fmtN = v => v == null ? "—" : Number(v).toLocaleString();
const pct = (a, b) => (a == null || !b) ? null : a / b * 100;
const fmtP = v => v == null ? "—" : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + "%";
// 성과: 7일 값이 있으면 7일, 없으면 24시간
function postStats(p){ const s = (p.d7 && p.d7.views != null) ? p.d7 : (p.h24 || {}); return { ...s, basis: (p.d7 && p.d7.views != null) ? "7일" : (p.h24 && p.h24.views != null) ? "24시간" : null }; }
function rhythmTarget(){
  if (R().weeklyTarget) return R().weeklyTarget;
  const g = state.goals.find(x => /뷰티/.test(x.name)); return g ? g.target : 2;
}
function postsInWeek(monday){ const days = new Set(weekDays(monday)); return R().posts.filter(p => days.has(p.date)).length; }
function rhythm(){
  const target = rhythmTarget(), cur = mondayOf(new Date());
  const weeks = Array.from({ length: 8 }, (_, i) => { const m = new Date(cur); m.setDate(m.getDate() - (7 - i) * 7); return { monday: ymd(m), n: postsInWeek(m) }; });
  let streak = 0;
  // 이번 주는 아직 진행 중이라, 달성했으면 포함하고 아니면 지난주부터 셈
  const thisN = postsInWeek(cur);
  if (thisN >= target) streak++;
  for (let i = weeks.length - 2; i >= 0; i--) { if (weeks[i].n >= target) streak++; else break; }
  const last = R().posts.reduce((m, p) => p.date > m ? p.date : m, "");
  return { target, thisN, weeks, streak, sinceLast: last ? daysBetween(last, todayStr()) : null };
}
function followerSeries(){ return [...R().followers].sort((a, b) => a.date < b.date ? -1 : 1); }
function statsDue(p){
  const age = daysBetween(p.date, todayStr());
  if (age >= 7 && !(p.d7 && p.d7.views != null)) return "7일";
  if (age >= 1 && !(p.h24 && p.h24.views != null)) return "24시간";
  return null;
}

  const posts = [...R().posts].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts);

  const typeRows = Object.entries(byType).map(([t, a]) => ({ t, n: a.length, v: a.reduce((x, y) => x + y.v, 0) / a.length,

// ===== 인스타 릴스 인사이트 캡처 분석 =====
function insightNum(t){

// 단어 → 같은 줄·가까운 글자끼리 묶은 '조각'(글자가 낱자로 쪼개져 읽혀도 다시 붙임)

    .filter(w => w.t).map(w => ({ ...w, cy: (w.y0 + w.y1) / 2 })).sort((a, b) => a.cy - b.cy);

    r.ws.forEach(w => { if (cur && w.x0 - cur.x1 < 70 * s) { cur.sp += (w.x0 - cur.x1 > 9 * s ? " " : "") + w.t; cur.t += w.t; cur.x1 = Math.max(cur.x1, w.x1); cur.y0 = Math.min(cur.y0, w.y0); cur.y1 = Math.max(cur.y1, w.y1); }
      else { cur = { t: w.t, sp: w.t, x0: w.x0, x1: w.x1, y0: w.y0, y1: w.y1 }; segs.push(cur); } }); });

}

  const src = {};
  [["reels", /^릴스탭$/], ["explore", /^탐색탭$/], ["feed", /^피드$/], ["story", /^스토리$/], ["profile", /^프로필$/], ["search", /^검색$/]].forEach(([k, re]) => {

}
function parseIconRow(text){
  const nums = (text.match(/\d[\d.,]*(만|천|[KkMm])?/g) || []).map(insightNum).filter(v => v != null);
  if (nums.length >= 5) return { likes: nums[0], comments: nums[1], reposts: nums[2], shares: nums[3], saves: nums[4] };

}
function iconBand(words, W){
  const s = W / 1185, g = words.find(w => /^개요$/.test((w.text || "").trim()));

  return bot > top ? { left: 0, top: Math.round(top), width: W, height: Math.round(bot - top) } : null;

// 게시물 화면 캡처의 캡션 → 제목 (인사이트 화면에는 제목이 없음)
const UI_TEXT = /^(좋아요|댓글|공유|팔로우|팔로잉|더보기|오리지널오디오|원본오디오|인사이트보기|게시물홍보하기|이릴스홍보하기|메시지보내기|리믹스|번역보기|답글|조회수|요약|조회수추이|조회수에영향|비율은도달|사람들이회원님|주요조회출처|팔로워가아닌|일반릴스|이릴스|건너뛰기|저장비율|공유비율|좋아요비율|댓글비율|리포스트비율|평균조회시간|조회한사람|릴스인사이트)/;

// 붙여넣은 글자(아이패드 '텍스트 인식'으로 복사한 것)에서 읽기
function parseInsightText(text){

  const out = {}, numIn = t => { const m = t.match(/\d[\d.,]*(만|천|[KkMm])?/); return m ? insightNum(m[0]) : null; };
  const pctIn = t => { const m = t.match(/(\d{1,3}(?:[.,]\d)?)%/); return m ? parseFloat(m[1].replace(",", ".")) : null; };

  const src = {}; [["reels", /^릴스탭/], ["explore", /^탐색탭/], ["feed", /^피드$/], ["story", /^스토리$/], ["profile", /^프로필$/], ["search", /^검색$/]].forEach(([k, re]) => { const v = after(re, pctIn); if (v != null) src[k] = v; });

// 흑백 + 다크모드 반전 + 대비
async function fileToCanvas(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("사진을 열지 못했어요")); i.src = url; });

    const d = g.getImageData(0, 0, W, H), a = d.data; let sum = 0;
    for (let i = 0; i < a.length; i += 4) { const v = a[i] * .299 + a[i + 1] * .587 + a[i + 2] * .114; a[i] = v; sum += v; }

    g.putImageData(d, 0, 0); return c;
  } finally { URL.revokeObjectURL(url); }
}

}
async function analyzeInsightImages(files, onStatus){
  ocrProgress = m => { if (m.status && /load|initializ/.test(m.status)) onStatus(`글자 인식 준비 중… ${Math.round((m.progress || 0) * 100)}% (처음 한 번만)`); };

    if (m.shareRate == null && m.shares != null) m.shareRate = r1(m.shares / m.views * 100);

/* ============ 손가락으로 옆으로 밀어 페이지 넘기기: 마을 → 시간표 → 달력 → 설정 ============ */
const PAGES = ["home", "tt", "cal", "dream", "set"];
function goPage(dir){
  const cur = ui.tab === "reels" ? 0 : PAGES.indexOf(ui.tab), next = cur + dir;
  if (cur < 0 || next < 0 || next >= PAGES.length) { const app = document.getElementById("app"); app.classList.remove("bump-l", "bump-r"); void app.offsetWidth; const cls = dir > 0 ? "bump-l" : "bump-r"; app.classList.add(cls); setTimeout(() => app.classList.remove(cls), 350); return; }
  ui.lightEdit = false; document.body.classList.remove("light-editing");
  ui.tab = PAGES[next]; ui.slide = dir > 0 ? "slide-l" : "slide-r";
  window.scrollTo(0, 0); render();
}
(() => {
  let st = null;
  // 옆으로 스크롤되는 영역(마을, 시간표, 진행 보드 등)은 먼저 그 안에서 움직이고, 끝에 닿은 상태에서 더 밀면 페이지가 넘어가요
  const hScroller = el => { for (; el && el !== document.body; el = el.parentElement) { if (el.scrollWidth > el.clientWidth + 2) { const ox = getComputedStyle(el).overflowX; if (ox === "auto" || ox === "scroll") return el; } } return null; };
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || ui.lightEdit || document.querySelector("#modal-root .overlay")) { st = null; return; }
    if (e.target.closest("input, textarea, select, .le-bar")) { st = null; return; }
    const t = e.touches[0], sc = hScroller(e.target);
    st = { x: t.clientX, y: t.clientY, t: Date.now(), sc, sl: sc ? sc.scrollLeft : 0, max: sc ? sc.scrollWidth - sc.clientWidth : 0 };
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!st) return; const s0 = st; st = null;
    const t = e.changedTouches[0], dx = t.clientX - s0.x, dy = t.clientY - s0.y;
    if (Date.now() - s0.t > 800 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    if (s0.sc) {
      const moved = Math.abs(s0.sc.scrollLeft - s0.sl) > 2;
      const atEdge = dx < 0 ? s0.sl >= s0.max - 2 : s0.sl <= 2;   // 밀기 시작할 때 이미 끝에 있었는지
      if (moved || !atEdge) return;
    }
    goPage(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener("touchcancel", () => { st = null; }, { passive: true });
})();

  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}${footer}</div>`;

function readImage(file, max = 420){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      let url = cv.toDataURL("image/webp", .85); if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/png");
      res(url); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function bindPlacing(){

    const d = CUSTOM().find(v => v.id === ui.placing);
    if (d) { d.x = +x.toFixed(1); d.y = +Math.min(92, Math.max(18, y)).toFixed(1); d.spot = null; }
    else state.chars[ui.placing] = { ...(state.chars[ui.placing] || {}), x: +x.toFixed(1), y: +Math.min(92, Math.max(18, y)).toFixed(1) };

const kyoboLink = b => `https://search.kyobobook.co.kr/search?keyword=${encodeURIComponent(b.isbn || b.title)}`;
// 교보 표지 → 안 되면 알라딘 표지 → 그것도 없으면 이름표 표지
function coverHTML(b, cls = "bk-cover"){

// 책 검색: 카카오(다음) 키가 있으면 카카오, 없거나 실패하면 구글 도서 (알라딘 OpenAPI는 2026-11-01 종료)
async function fetchJSON(url, headers){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 8000);
  try { const r = await fetch(url, { headers, signal: ctrl.signal }); if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "key" : "http " + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
const isbnOf = q => { const d = q.replace(/[-\s]/g, ""); return /^\d{10}(\d{3})?$/.test(d) ? d : null; };
async function kakaoSearch(q, key){
  const isbn = isbnOf(q);
  const d = await fetchJSON(`https://dapi.kakao.com/v3/search/book?size=12&query=${encodeURIComponent(isbn || q)}${isbn ? "&target=isbn" : ""}`, { Authorization: `KakaoAK ${key}` });
  return (d.documents || []).map(it => { const is = (it.isbn || "").split(" ").filter(Boolean);
    return { isbn: is.find(x => x.length === 13) || is[0] || "", title: it.title || "", author: (it.authors || []).join(", ") + (it.translators && it.translators.length ? ` (옮김 ${it.translators.join(", ")})` : ""),
      publisher: it.publisher || "", pubDate: (it.datetime || "").slice(0, 10), cover: it.thumbnail || "" }; });
}
async function googleSearch(q){
  const isbn = isbnOf(q);
  const d = await fetchJSON(`https://www.googleapis.com/books/v1/volumes?maxResults=12&printType=books&q=${encodeURIComponent(isbn ? "isbn:" + isbn : q)}`);
  return (d.items || []).map(({ volumeInfo: v = {} }) => { const ids = v.industryIdentifiers || [];
    return { isbn: (ids.find(x => x.type === "ISBN_13") || ids.find(x => x.type === "ISBN_10") || {}).identifier || "", title: [v.title, v.subtitle].filter(Boolean).join(" : "), author: (v.authors || []).join(", "),
      publisher: v.publisher || "", pubDate: v.publishedDate || "", cover: ((v.imageLinks || {}).thumbnail || "").replace(/^http:/, "https:") }; }).filter(x => x.title);
}
async function bookSearch(q){
  const key = BK().kakao;
  if (key) { try { return { list: await kakaoSearch(q, key), via: "카카오" }; } catch (e) { if (e.message === "key") throw new Error("카카오 키가 맞지 않아요. 키를 확인해주세요."); } }
  return { list: await googleSearch(q), via: "구글 도서" };
}

/* ============ 🐱 모찌 채널: '영적세계전문가' 게시물로 일본어 공부 ============
   mochi/posts.json (글·번역·낱말), mochi/dict.json (낱말 뜻·읽기·JLPT), mochi/kanji.json (한자 급수)
   은 GitHub Actions가 3시간마다 만들어요. 단어장·복습 기록은 이 아이패드에 저장돼요. */
let mcData = null, mcDict = {}, mcKanji = {}, mcLoading = null;
function mcLoad(force){
  if (mcData && !force) return Promise.resolve(mcData);
  if (mcLoading) return mcLoading;
  const get = f => fetch(f, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  mcLoading = Promise.all([get("mochi/posts.json"), get("mochi/dict.json"), get("mochi/kanji.json")]).then(([d, dict, kj]) => {
    mcLoading = null; if (dict) mcDict = dict; if (kj) mcKanji = kj; if (dict && state.mochi) mcFillVocab();
    if (d && Array.isArray(d.posts)) mcData = d; return mcData; });
  return mcLoading;
}
const MC_DEF = () => ({ show: { ja: true, ko: false, kana: false }, furi: "hard", rate: 1, opened: {}, since: null, read: {}, seen: null, vocab: {}, stats: {}, level: 3 });
const MC = () => { const m = state.mochi || (state.mochi = MC_DEF()); for (const [k, v] of Object.entries(MC_DEF())) if (m[k] === undefined) m[k] = v; return m; };
const mcStat = (k, n = 1) => { const d = todayStr(), st = MC().stats[d] || (MC().stats[d] = {}); st[k] = (st[k] || 0) + n; };
const HAS_K = /[一-鿿々]/;
// 낱말 급수: 네이버 JLPT(jl) → 없으면 한자 급수(lv). 숫자가 작을수록 어려움 (0 = 급수 밖)
function wordLv(w){ const d = mcDict[w]; if (d && d.jl) return d.jl; if (d && d.lv != null) return d.lv; const ks = [...w].filter(c => HAS_K.test(c)); return ks.length ? Math.min(...ks.map(c => mcKanji[c] || 0)) : null; }
// 사전 뜻은 핵심만 (뜻 2개까지, 설명 꼬리 자르기)
const shortKo = ko => String(ko || "").split(/\s*\/\s*/).map(x => x.split(/[;；]/)[0].replace(/[.。]\s*$/, "").trim()).filter(Boolean).slice(0, 2).join(" / ");
const lvBadge = lv => lv == null ? "" : `<span class="mc-lv lv${lv}">${lv ? "N" + lv : "N1+"}</span>`;
// 후리가나: "hard" = 내 급수(N3)보다 어려운 한자가 있을 때만
function needFuri(sf){
  const f = MC().furi; if (f === "all") return true;
  const my = MC().level || 3;
  return [...sf].some(c => HAS_K.test(c) && ((mcKanji[c] || 0) < my));
}
// 送り仮名 나누기: 食べる/たべる → <ruby>食<rt>た</rt></ruby>べる
function rubyHTML(sf, rd){
  let a = 0, b = 0;
  while (a < sf.length && a < rd.length && !HAS_K.test(sf[a]) && sf[a] === rd[a]) a++;
  while (b < sf.length - a && b < rd.length - a && !HAS_K.test(sf[sf.length - 1 - b]) && sf[sf.length - 1 - b] === rd[rd.length - 1 - b]) b++;
  const mid = sf.slice(a, sf.length - b), mr = rd.slice(a, rd.length - b);
  if (!mid || !mr) return esc(sf);
  return `${esc(sf.slice(0, a))}<ruby>${esc(mid)}<rt>${esc(mr)}</rt></ruby>${esc(sf.slice(sf.length - b))}`;
}
function jaLineHTML(l, withFuri){
  if (!l.t) return withFuri ? l.ruby : esc(l.ja);
  const V = MC().vocab;
  return l.t.map(([sf, rd, key]) => {
    const inner = withFuri && rd && needFuri(sf) ? rubyHTML(sf, rd) : esc(sf);
    // 사전에 없는 낱말도 한자가 있으면 눌러서 읽기·사전 링크를 볼 수 있게
    const k = key || (HAS_K.test(sf) ? sf : "");
    return k ? `<span class="mc-w ${V[k] ? "saved" : ""}" data-w="${esc(k)}" data-s="${esc(sf)}" data-r="${esc(rd || "")}">${inner}</span>` : inner;
  }).join("");
}

/* ---- 🔊 일본어 읽어주기 (아이패드에 들어 있는 일본어 음성, 인터넷·비용 없음) ---- */
let jaVoice = null;
function pickJaVoice(){ const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; const ja = vs.filter(v => /^ja/i.test(v.lang)); jaVoice = ja.find(v => /kyoko|o-ren|otoya|hattori|google/i.test(v.name)) || ja[0] || null; return jaVoice; }
if (window.speechSynthesis) { pickJaVoice(); speechSynthesis.onvoiceschanged = pickJaVoice; }
function sayJa(text, opts = {}){
  if (!window.speechSynthesis) { toast("이 기기에선 읽어주기를 쓸 수 없어요"); return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[「」『』💌✨🌿]/g, ""));
  u.lang = "ja-JP"; u.voice = jaVoice || pickJaVoice(); u.rate = opts.rate || MC().rate || 1;
  if (opts.onend) u.onend = opts.onend; if (opts.onerror) u.onerror = opts.onerror;
  speechSynthesis.speak(u); return true;
}
function stopJa(){ if (window.speechSynthesis) speechSynthesis.cancel(); }

/* ---- 복습 (간격 반복): 알았어 → 1·3·7·14·30·60·120일 뒤, 헷갈려 → 간격 절반, 몰랐어 → 처음부터 ---- */
const SRS_DAYS = [1, 3, 7, 14, 30, 60, 120];
const addDaysStr = (d, n) => { const x = parseYmd(d); x.setDate(x.getDate() + n); return ymd(x); };
function vocabDue(){ const t = todayStr(); return Object.entries(MC().vocab).filter(([, v]) => (v.due || t) <= t).map(([w]) => w); }
function srsGrade(w, g){
  const v = MC().vocab[w]; if (!v) return; const t = todayStr();
  v.n = (v.n || 0) + 1; v.last = t;
  if (g === 0) { v.step = 0; v.due = t; v.miss = (v.miss || 0) + 1; }
  else if (g === 1) { v.due = addDaysStr(t, Math.max(1, Math.round(SRS_DAYS[v.step || 0] / 2))); }
  else { v.ok = (v.ok || 0) + 1; v.due = addDaysStr(t, SRS_DAYS[Math.min(SRS_DAYS.length - 1, v.step || 0)]); v.step = Math.min(SRS_DAYS.length - 1, (v.step || 0) + 1); }
  mcStat("rev"); if (g === 2) mcStat("ok");
  Store.save();
}
function addVocab(w, ex){
  const d = mcDict[w] || { r: (ex && ex.r) || "" }, V = MC().vocab;
  if (V[w]) return false;
  V[w] = { r: d.r || "", ko: shortKo(d.ko), lv: wordLv(w), ex: ex || null, added: todayStr(), due: todayStr(), step: 0 };
  mcStat("words"); Store.save(); return true;
}

const EV_EMOJI = ["📌", "🎂", "🏥", "✈️", "🍽️", "☕", "💼", "⛪", "🎉", "📚", "💇", "🛍️"];

function evStartsOn(e, s){
  if (s < e.date) return false;

  if (e.repeat === "monthly") return s.slice(8) === e.date.slice(8);

/* ============ 🥁 둥둥이: 찬양 콘티 → 유튜브 찬양기도회 영상 챕터 링크 ============
   worship/songs.json 은 GitHub Actions가 매일 예수사랑교회 채널에서
   "[예수사랑교회 성금요일 총체적 치유 찬양기도회]" 영상들의 챕터(곡 + 시작 시각)를 모아 만든 파일이에요. */
const WS_CHANNEL = "https://www.youtube.com/@jesuslovechurch6503";
let wsIndex = null, wsLoading = null;
const W = () => { const w = state.worship || (state.worship = { sets: [] }); w.bpm = w.bpm || {}; return w; };
function wsLoad(force){
  if (wsIndex && !force) return Promise.resolve(wsIndex);
  if (wsLoading) return wsLoading;
  wsLoading = fetch("worship/songs.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
    wsLoading = null;
    if (!d || !Array.isArray(d.videos)) return wsIndex;
    const songs = [];
    d.videos.forEach((v, vi) => (v.chapters || []).forEach(c => { if (!wsSkip(c.title)) songs.push({ v, vi, t: c.t, title: c.title.replace(/^[^\p{L}\p{N}(]+/u, "").trim(), n: wsNorm(c.title), nf: wsNormFull(c.title) }); }));
    wsIndex = { videos: d.videos, songs, updated: d.updated };
    return wsIndex;
  });
  return wsLoading;
}
// 찬양이 아닌 챕터(말씀·영상 등)는 빼기
function wsSkip(title){ const n = wsNorm(title); if (/^\W*\(?\s*영상\s*\)/.test(title)) return true; return !n || /^(말씀|밀씀|영상|광고|기도|헌금|축도|오프닝|인트로|엔딩|광고영상|설교)$/.test(n); }
function wsNorm(s){ return String(s || "").normalize("NFC").toLowerCase().replace(/\(.*?\)|\[.*?\]/g, " ").replace(/new\s*ver\.?/g, "").replace(/[^0-9a-z가-힣]/g, ""); }
function wsNormFull(s){ return String(s || "").normalize("NFC").toLowerCase().replace(/[^0-9a-z가-힣]/g, ""); }
function wsSim(a, b){
  if (!a || !b) return 0;
  if (a === b) return 1;
  const s = a.length <= b.length ? a : b, l = a.length <= b.length ? b : a;
  if (s.length >= 3 && l.includes(s)) return .82 + .16 * s.length / l.length;
  const bg = x => { const m = new Map(); for (let i = 0; i < x.length - 1; i++) { const k = x.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
  const A = bg(a), B = bg(b); let inter = 0, tot = 0;
  A.forEach((n, k) => { inter += Math.min(n, B.get(k) || 0); tot += n; }); B.forEach(n => tot += n);
  return tot ? 2 * inter / tot : 0;
}
// 가장 비슷한 곡 → 그중 가장 최근 영상
function wsFind(q){
  if (!wsIndex) return { pick: null, cands: [] };
  const qn = wsNorm(q), qf = wsNormFull(q);
  const scored = wsIndex.songs.map(s => ({ s, score: Math.max(wsSim(qn, s.n), wsSim(qf, s.nf) - .02) })).filter(x => x.score >= .5);
  if (!scored.length) return { pick: null, cands: [] };
  const best = Math.max(...scored.map(x => x.score));
  const near = scored.filter(x => x.score >= best - .06).sort((a, b) => a.s.vi - b.s.vi || a.s.t - b.s.t);
  const cands = [], seen = new Set();
  [...near, ...scored.sort((a, b) => b.score - a.score || a.s.vi - b.s.vi)].forEach(x => { const k = x.s.v.id + ":" + x.s.t; if (!seen.has(k) && cands.length < 6) { seen.add(k); cands.push(x.s); } });
  return { pick: near[0].s, cands, score: best };
}
const wsLink = (id, t) => `https://youtu.be/${id}${t ? `?t=${t}` : ""}`;
const wsClock = t => t >= 3600 ? `${Math.floor(t / 3600)}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}` : `${Math.floor(t / 60)}:${pad(t % 60)}`;

/* 카톡에서 복사한 글 → 곡 제목들 */
function wsParse(raw){
  const lines = [];
  String(raw || "").split(/\r?\n/).forEach(line0 => {
    let line = line0.replace(/^\s*\[[^\]]*\]\s*\[[^\]]*\]\s*/, "");          // [찬양팀장] [오후 3:21]
    const numbered = /^\s*(?:\d{1,2}\s*[.)．、:]|[①-⑳]|\(\d{1,2}\))/.test(line);
    line = line.replace(/^\s*(?:\d{1,2}\s*[.)．、:]|[①-⑳]|\(\d{1,2}\)|[-•·*▪▶>]+)\s*/, "");
    line.split(/\s+[\/+]\s+|\s*→\s*(?=[가-힣])/).forEach(part => {
      let t = part
        .replace(/\(\s*[A-G][#b♭♯]?m?\s*(?:(?:→|->|-|~)\s*[A-G][#b♭♯]?m?)*\s*(?:key|키|코드)?\s*\)/gi, " ")   // (G) (G→A)
        .replace(/\[\s*[A-G][#b♭♯]?m?\s*(?:key|키)?\s*\]/gi, " ")
        .replace(/(?:key|키|코드)\s*[:：]?\s*[A-G][#b♭♯]?m?\b/gi, " ")
        .replace(/\s[-–]\s*[A-G][#b♭♯]?m?\s*(?:key|키)?\s*$/i, " ")
        .replace(/\s[A-G][#b♭♯]?m?\s*(?:key|키)\s*$/i, " ")
        .replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu, "")
