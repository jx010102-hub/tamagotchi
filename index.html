<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDF7E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성장 다마고치">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>성장 다마고치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF7E8; --paper: #FFFDF7; --ink: #4A3529; --ink-soft: #8C7466; --line: #E9DCC8;
    --sage: #AFCB8F; --sage-pale: #EAF2DD; --blush: #F4B4AC; --blush-pale: #FCE6E1;
    --butter: #F6D978; --butter-pale: #FBF0C9; --shadow: #F0E2CB;
    --hand: "Gaegu", "Gowun Dodum", cursive;
    --body: "Gowun Dodum", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--body); }
  body { background-image: radial-gradient(circle at 12% 8%, #fff8e0 0, transparent 40%), radial-gradient(circle at 90% 30%, #fbeee6 0, transparent 35%); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 110px; }
  h1, h2, h3, .hand { font-family: var(--hand); font-weight: 700; }
  h1 { font-size: 30px; margin: 4px 0 2px; }
  h2 { font-size: 24px; margin: 0 0 10px; }
  h3 { font-size: 20px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  .card { background: var(--paper); border: 2px solid var(--ink); border-radius: 24px 28px 26px 22px; padding: 18px; margin-bottom: 16px; box-shadow: 0 6px 0 var(--shadow); }
  .card.soft { border-color: var(--line); box-shadow: none; }

  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 16px; outline: none; -webkit-appearance: none; appearance: none; min-height: 48px;
  }
  input:focus { border-color: #7FA461; }
  input::placeholder { color: #C5B4A6; }

  button { font: inherit; color: var(--ink); cursor: pointer; border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 11px 18px; font-size: 15px; transition: transform .08s, box-shadow .08s; box-shadow: 0 3px 0 var(--ink); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button:disabled { opacity: .35; cursor: default; transform: none; box-shadow: 0 3px 0 var(--ink); }
  .btn-primary { background: var(--sage); font-family: var(--hand); font-weight: 700; font-size: 20px; padding: 10px 22px; }
  .btn-pink { background: var(--blush); }
  .btn-ghost { border-color: var(--line); box-shadow: none; background: transparent; color: var(--ink-soft); }
  .btn-ghost:active { box-shadow: none; }
  .btn-sm { font-size: 13px; padding: 6px 12px; box-shadow: 0 2px 0 var(--ink); }
  .btn-danger { color: #B04A3E; border-color: #E5B3AA; box-shadow: none; background: transparent; }
  .btn-danger:active { box-shadow: none; }
  .btn-block { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 110px; }
  .err { color: #B04A3E; font-size: 13px; margin-top: 8px; min-height: 1em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 2px solid var(--line); border-radius: 999px; font-size: 14px; background: #fff; cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); flex-shrink: 0; }

  .bar { height: 14px; background: #F3EBDD; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; transition: width .5s ease; }
  .bar.thin { height: 10px; border-width: 1.5px; }

  /* 친구들 무대 */
  .friends { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 16px; }
  .friend { background: var(--paper); border: 2px solid var(--ink); border-radius: 26px; padding: 12px 8px 14px; text-align: center; cursor: pointer; box-shadow: 0 6px 0 var(--shadow); position: relative; transition: transform .15s; }
  .friend:active { transform: translateY(3px); }
  .friend .spot { position: relative; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
  .friend .spot::before { content: ""; position: absolute; bottom: 4px; width: 78%; height: 46px; border-radius: 50%; background: var(--c-bg); }
  .sprite { position: relative; max-width: 92%; animation: bob 2.8s ease-in-out infinite; transform-origin: bottom center; user-select: none; -webkit-user-drag: none; }
  .friend:nth-child(2) .sprite { animation-delay: -.9s; }
  .friend:nth-child(3) .sprite { animation-delay: -1.8s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .prop { position: absolute; top: 6px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; font-family: var(--hand); z-index: 1; }
  .friend .fname { font-family: var(--hand); font-size: 23px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--c-bg); margin-top: 4px; }
  .friend .today { font-family: var(--hand); font-size: 20px; font-weight: 700; margin-top: 8px; }
  .friend .bar { margin: 6px 6px 0; }
  .friend .tap { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  .running { display: inline-flex; align-items: center; gap: 5px; font-family: var(--hand); font-weight: 700; font-size: 18px; background: var(--blush-pale); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; margin-top: 8px; }
  .running::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #E2685A; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .sum-line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px dashed var(--line); }
  .sum-line:first-child { border-top: 0; padding-top: 2px; }
  .sum-line img { width: 52px; height: 52px; object-fit: contain; }
  .sum-line .t { font-family: var(--hand); font-size: 20px; font-weight: 700; line-height: 1.2; }

  .timer-card { display: flex; align-items: center; gap: 14px; background: var(--blush-pale); }
  .timer-card img { width: 70px; height: 70px; object-fit: contain; }
  .timer-card .clock { font-family: var(--hand); font-size: 36px; font-weight: 700; line-height: 1; }


  /* 마을 장면 */
  .scene-wrap { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: #CFE8F5; }
  .scene-wrap::-webkit-scrollbar { display: none; }
  .scene { position: relative; width: max(100vw, calc(100vh * 1.3333)); aspect-ratio: 1448 / 1086; }
  @supports (height: 100dvh) { .scene { width: max(100vw, calc(100dvh * 1.3333)); } }
  .village { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .npc { position: absolute; transform: translate(-50%, -100%); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .npc .body { position: relative; width: 100%; }
  .npc .body::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -4%; height: 16%; border-radius: 50%; background: rgba(74,53,41,.18); filter: blur(2px); z-index: -1; }
  .npc .sprite { width: 100%; max-width: none; display: block; animation: bob 2.8s ease-in-out infinite; transform-origin: bottom center; filter: drop-shadow(0 2px 0 rgba(255,255,255,.7)); user-select: none; -webkit-user-drag: none; }
  .npc:nth-of-type(2) .sprite { animation-delay: -.7s; } .npc:nth-of-type(3) .sprite { animation-delay: -1.4s; } .npc:nth-of-type(4) .sprite { animation-delay: -2.1s; }
  .npc:active .sprite { animation: pop .35s ease; }
  .npc .prop { top: -4%; right: -10%; width: clamp(22px, 2.2vw, 34px); height: clamp(22px, 2.2vw, 34px); font-size: clamp(11px, 1.1vw, 17px); }
  .tagline { display: flex; flex-direction: column; align-items: center; background: rgba(255,253,247,.94); border: 2px solid var(--ink); border-radius: 14px; padding: 2px 10px 3px; margin-bottom: 4px; white-space: nowrap; box-shadow: 0 3px 0 rgba(74,53,41,.25); position: relative; }
  .tagline::after { content: ""; position: absolute; bottom: -7px; left: 50%; width: 10px; height: 10px; background: rgba(255,253,247,.94); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  .tagline .nm { font-family: var(--hand); font-weight: 700; font-size: clamp(15px, 1.5vw, 21px); line-height: 1.05; }
  .tagline .tm { font-size: clamp(10px, .95vw, 13px); color: var(--ink-soft); line-height: 1.1; }
  .tagline .run { font-family: var(--hand); font-weight: 700; font-size: clamp(13px, 1.2vw, 17px); color: #C4473A; line-height: 1.1; }
  .npc .mini { width: 70%; height: 7px; margin-top: 3px; background: rgba(255,253,247,.9); border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; }
  .npc .mini i { display: block; height: 100%; background: var(--c-main); }
  .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 4; }
  .hud > * { pointer-events: auto; }
  .hud-card { background: rgba(255,253,247,.93); border: 2px solid var(--ink); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 rgba(74,53,41,.2); }
  .hud-btn { background: rgba(255,253,247,.95); }
  .quick { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 84px); left: 12px; display: none; gap: 6px; z-index: 4; }
  .quick button { width: 48px; height: 48px; border-radius: 50%; padding: 2px; background: var(--c-bg); box-shadow: 0 3px 0 var(--ink); }
  .quick img { width: 100%; height: 100%; object-fit: contain; }
  @media (max-aspect-ratio: 4/3) { .quick { display: flex; } .hint { top: 152px; } }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); top: 84px; background: var(--butter-pale); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; z-index: 4; white-space: nowrap; animation: nudge 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes nudge { 50% { transform: translate(-50%, 4px); } }
  .timer-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 72px); display: flex; align-items: center; gap: 10px; background: var(--c-bg); border: 2px solid var(--ink); border-radius: 22px; padding: 6px 10px 6px 6px; box-shadow: 0 4px 0 rgba(74,53,41,.25); z-index: 5; white-space: nowrap; }
  .timer-pill img { width: 46px; height: 46px; object-fit: contain; }
  .timer-pill .clock { font-family: var(--hand); font-size: 24px; font-weight: 700; line-height: 1; }


  /* 주간 시간표 */
  .tt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-top: 4px; margin: 0 -4px; }
  .tt-paper { position: relative; min-width: 660px; padding: 90px 6px 10px; }
  .tt-doodle { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 360px; height: 95px; object-fit: contain; object-position: bottom; pointer-events: none; z-index: 1; }
  .tt { position: relative; display: grid; grid-template-columns: 42px repeat(7, 1fr); background: #fff; border: 3px solid #2E2620; border-radius: 6px 8px 6px 7px; box-shadow: 0 6px 0 var(--shadow); }
  .tt > * { border-right: 2px solid #2E2620; border-bottom: 2px solid #2E2620; }
  .tt > *:nth-child(8n) { border-right: 0; }
  .tt-corner { background: #fff; }
  .tt-corner, .tt-side { position: sticky !important; left: 0; z-index: 3; }
  .tt-dh { text-align: center; padding: 6px 2px 4px; font-family: var(--hand); line-height: 1.05; background: #fff; }
  .tt-dh b { display: block; font-size: 21px; letter-spacing: 1.5px; }
  .tt-dh span { font-size: 13px; color: var(--ink-soft); }
  .tt-dh.today { background: var(--sage-pale); }
  .tt-dh.wk b { color: #B06A5E; }
  .tt-side { position: relative; font-family: var(--hand); font-size: 18px; font-weight: 700; text-align: center; background: #fff; }
  .tt-side.small { font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 4px 0; }
  .tt-hours { position: relative; }
  .tt-hours span { position: absolute; left: 0; right: 0; padding-top: 2px; }
  .tt-allday { min-height: 44px; padding: 3px; display: flex; flex-direction: column; gap: 3px; cursor: copy; background: #FFFDF7; }
  .tt-col { position: relative; cursor: copy; background-image: linear-gradient(to bottom, transparent calc(100% - 1.5px), #E6DCCB calc(100% - 1.5px)); }
  .tt-col.today { background-color: #F8FBF3; }
  .tt-now { position: absolute; left: 0; right: 0; height: 0; border-top: 2.5px solid #E2685A; z-index: 2; pointer-events: none; }
  .tt-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 9px; height: 9px; border-radius: 50%; background: #E2685A; }
  .tt-block { position: absolute; display: flex; flex-direction: column; align-items: flex-start; text-align: left; overflow: hidden; padding: 3px 5px; border-radius: 8px; border: 2px dashed #6B5547; box-shadow: none; font-size: 12px; line-height: 1.2; z-index: 1; }
  .tt-block:active { transform: none; box-shadow: none; filter: brightness(.96); }
  .tt-block.chip-b { position: relative; width: 100%; padding: 3px 5px; }
  .tt-block.done { border-style: solid; border-color: #2E2620; }
  .tt-block.review { border-color: #E09A4E; border-style: dashed; }
  .tt-block.done .tt-name { text-decoration: line-through; text-decoration-color: rgba(46,38,32,.45); }
  .tt-name { font-weight: 700; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tt-time { font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; }
  .tt-stamp { position: absolute; right: 3px; bottom: 2px; font-family: var(--hand); font-weight: 700; font-size: 18px; color: #4F7A35; }
  .tt-rv { position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #F2B46A; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .tt-actual { padding: 3px; display: flex; flex-direction: column; gap: 2px; min-height: 30px; background: #FFFDF7; border-bottom: 0 !important; }
  .tt > .tt-side:nth-last-child(8) { border-bottom: 0; }
  .tt-act { font-size: 10.5px; padding: 1px 4px; border-radius: 6px; border: 1.5px solid #2E2620; }


  .now-line { font-size: 13px; margin-top: 3px; }
  .toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translate(-50%, -140%); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 14px; box-shadow: 0 4px 0 rgba(74,53,41,.2); z-index: 30; transition: transform .35s ease; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { transform: translate(-50%, 0); }
  .tpl-tag { display: flex; height: 100%; align-items: center; justify-content: center; font-family: var(--hand); font-weight: 700; font-size: 15px; color: #9A6A10; background: var(--butter-pale); }
  .tt.is-tpl { box-shadow: 0 6px 0 #F2DFA6; }
  .tt-block.tpl { border-style: solid; border-color: #6B5547; }


  /* 월간 달력 */
  .mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .mdow { text-align: center; font-family: var(--hand); font-weight: 700; font-size: 17px; color: var(--ink-soft); padding-bottom: 2px; }
  .mdow.wk { color: #B06A5E; }
  .mday { display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-height: 92px; padding: 4px 3px 5px; background: #fff; border: 2px solid var(--line); border-radius: 12px; box-shadow: none; text-align: left; font-size: 11px; overflow: hidden; }
  .mday:active { transform: none; box-shadow: none; border-color: var(--ink); }
  .mday.out { opacity: .38; }
  .mday.today { border-color: var(--ink); background: var(--butter-pale); }
  .mdn { font-family: var(--hand); font-weight: 700; font-size: 17px; line-height: 1; padding: 0 2px 2px; }
  .mday.today .mdn { color: #4F7A35; }
  .mchip { display: flex; align-items: center; gap: 3px; border-radius: 7px; padding: 1px 4px; font-size: 10.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; }
  .mchip i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--ink); }
  .dchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 999px; border: 1.5px solid var(--ink); font-size: 13px; }
  .dchip img { width: 24px; height: 24px; object-fit: contain; }
  .dtl { position: relative; margin-top: 12px; display: grid; grid-template-columns: 34px 1fr; }
  .dtl-hours { position: relative; font-family: var(--hand); font-weight: 700; font-size: 16px; text-align: center; }
  .dtl-hours span { position: absolute; left: 0; right: 0; top: 0; transform: translateY(-2px); }
  .dtl-col { position: relative; border: 2px solid var(--ink); border-radius: 10px; background-color: #fff; background-image: linear-gradient(to bottom, transparent calc(100% - 1.5px), #E6DCCB calc(100% - 1.5px)); }
  .dtl-b { position: absolute; display: flex; gap: 6px; align-items: flex-start; overflow: hidden; border: 2px solid; border-radius: 10px; padding: 3px 7px; font-size: 13px; line-height: 1.3; }
  .dtl-b img { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
  .dtl-list { margin-top: 12px; font-size: 14px; }
  .dtl-list summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; padding: 4px 0; }
  @media (max-width: 560px) {
    .mcal { gap: 3px; }
    .mday { min-height: 70px; padding: 3px 2px; border-radius: 9px; }
    .mlbl { display: none; }
    .mchip { padding: 1px 1px; font-size: 8.5px; gap: 2px; letter-spacing: -0.3px; }
    .mchip i { width: 6px; height: 6px; }
    .mdn { font-size: 15px; }
  }

  /* 탭바 */
  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 4px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 6px; box-shadow: 0 5px 0 var(--shadow); z-index: 5; }
  .tabbar button { border: 0; box-shadow: none; background: transparent; padding: 8px 18px; font-family: var(--hand); font-size: 19px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .tabbar button.on { background: var(--sage); color: var(--ink); }
  .tabbar button:active { transform: none; }
  .fab { position: fixed; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%; padding: 0; background: var(--blush); font-size: 30px; font-family: var(--hand); font-weight: 700; z-index: 5; }

  /* 달력 */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .week-nav strong { font-family: var(--hand); font-size: 21px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 6px 3px 8px; min-height: 124px; cursor: pointer; text-align: center; }
  .day .dow { font-size: 12px; color: var(--ink-soft); }
  .day .dn { font-family: var(--hand); font-size: 20px; font-weight: 700; width: 32px; height: 32px; line-height: 32px; margin: 2px auto 4px; border-radius: 50%; }
  .day.today .dn { background: var(--sage); border: 1.5px solid var(--ink); line-height: 29px; }
  .day.selected { border-color: var(--ink); background: var(--butter-pale); }
  .day.future { opacity: .45; cursor: default; }
  .day .ent { font-size: 11px; line-height: 1.25; margin: 3px 0; padding: 2px 2px; border-radius: 8px; }
  .day .stamp { width: 30px; height: 30px; object-fit: contain; margin-top: 2px; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px dashed var(--line); }
  .list-item:first-child { border-top: 0; }
  .list-item .amt { font-family: var(--hand); font-size: 20px; font-weight: 700; white-space: nowrap; }
  .empty { text-align: center; padding: 10px 0; }

<body>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>

<script>
/* ============ 캐릭터 정의 ============ */
const CHARS = [
  { id: "jp",    folder: "cat",     skill: "일본어",   name: "모찌",   verb: "공부", prop: "あ", main: "#F6D978", bg: "#FBF0C9", dailyGoal: 60, weeklyGoal: 420, x: 79, y: 84, w: 8.5, spot: "도서관" },
  { id: "toon",  folder: "sprout",  skill: "인스타툰", name: "콩이",   verb: "작업", prop: "✏️", main: "#AFCB8F", bg: "#EAF2DD", dailyGoal: 60, weeklyGoal: 300, x: 47, y: 74, w: 8,   spot: "분수 광장" },
  { id: "reels", folder: "bunny",   skill: "릴스",     name: "릴리",   verb: "작업", prop: "🎬", main: "#F4B4AC", bg: "#FCE6E1", dailyGoal: 60, weeklyGoal: 300, x: 67, y: 57, w: 8.5, spot: "카페 테라스" },
  { id: "drum",  folder: "hamster", skill: "드럼",     name: "둥둥이", verb: "연습", prop: "🥁", main: "#E6C3A0", bg: "#F7EADC", dailyGoal: 30, weeklyGoal: 180, x: 27, y: 64, w: 11,  spot: "공연 무대" },
];
const POSES = ["idle","hi","base","focus","done1","done2","done3","sleep","cry","lazy","eat","levelup","weekly","empty","think"];
const SP = (id, pose) => `sprites/${(CHARS.find(c => c.id === id) || CHARS[0]).folder}/${pose}.webp`;
POSES.forEach(p => CHARS.forEach(c => { const i = new Image(); i.src = SP(c.id, p); }));

/* ============ 유틸 ============ */
const KEY = "growth-tamagotchi-v2";
const DOW = ["월","화","수","목","금","토","일"];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function pad(n){ return String(n).padStart(2, "0"); }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayStr(){ return ymd(new Date()); }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function weekDays(monday){ return Array.from({length:7}, (_,i) => { const d = new Date(monday); d.setDate(d.getDate()+i); return ymd(d); }); }
function fmtMD(s){ const d = parseYmd(s); return (d.getMonth()+1) + "월 " + d.getDate() + "일"; }
function hasBatchim(w){ const c = w.charCodeAt(w.length-1); if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0; return /[013678]$/.test(w); }
function josa(w, a, b){ return w + (hasBatchim(w) ? a : b); }
function callName(n){ return hasBatchim(n) ? n + "이" : n; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
// 분 → "1시간 20분"
function fmtDur(min){ min = Math.round(min); const h = Math.floor(min/60), m = min % 60; if (!h) return m + "분"; return m ? `${h}시간 ${m}분` : `${h}시간`; }
function fmtShort(min){ min = Math.round(min); const h = Math.floor(min/60), m = min % 60; return h ? (m ? `${h}h${m}m` : `${h}h`) : `${m}m`; }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms/1000)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; }

/* ============ 상태 ============ */
let state = emptyState();
function emptyState(){ return { chars: {}, records: [], timer: null, plans: [], goals: [], goalLogs: [], imports: [], template: [], templateFrom: null, filledDates: [], createdAt: Date.now(), updatedAt: 0 }; }
function normalize(s){
  const e = emptyState();
  if (!s || typeof s !== "object") return e;
  const arr = k => Array.isArray(s[k]) ? s[k] : [];
  return { chars: s.chars || {}, records: arr("records"), timer: s.timer || null,
    plans: arr("plans"), goals: arr("goals"), goalLogs: arr("goalLogs"), imports: arr("imports"),
    template: arr("template"), templateFrom: s.templateFrom || null, filledDates: arr("filledDates"),
    createdAt: s.createdAt || e.createdAt, updatedAt: s.updatedAt || 0 };
}

/* ============ 계획 일정 (실제 기록과 별개 — 경험치 없음) ============ */
// 11월 둘째 주(일요일 시작 주: 11/8 일 ~ 11/14 토) 일정 — 처음 한 번만 추가
const SEED_ID = "2026-11-week2";
const SEED = {
  week: "11월 둘째 주",
  dates: { "일요일": "2026-11-08", "월요일": "2026-11-09", "화요일": "2026-11-10", "수요일": "2026-11-11", "목요일": "2026-11-12", "금요일": "2026-11-13", "토요일": "2026-11-14" },
  schedule: [
    { day: "일요일", activities: [ { name: "주일예배", category: "예배" }, { name: "클로드 / 가계부 제작", category: "개발" } ] },
    { day: "월요일", activities: [
      { name: "237 알바", start: "11:00", end: "14:00", category: "아르바이트" },
      { name: "인스타툰 제작 및 기타 활동", start: "15:00", end: "20:00", category: "창작", needs_review: true },
      { name: "기도회", start: "20:00", end: "21:00", category: "예배" },
      { name: "찬양 합주", start: "21:00", end: "23:00", category: "음악" } ] },
    { day: "화요일", activities: [
      { name: "청년 관련 활동 / 클로드 제작", start: "09:00", end: "11:00", needs_review: true },
      { name: "활동 확인 필요", start: "12:00", end: "17:00", needs_review: true },
      { name: "찬양 연습", duration_minutes: 60, needs_review: true },
      { name: "기도회", start: "20:00", end: "21:00", category: "예배" } ] },
    { day: "수요일", activities: [
      { name: "237 알바", start: "11:00", end: "14:00", category: "아르바이트" },
      { name: "활동 확인 필요", start: "15:30", end: "17:00", needs_review: true },
      { name: "수요예배", start: "18:00", end: "22:00", category: "예배" } ] },
    { day: "목요일", activities: [] },
    { day: "금요일", activities: [ { name: "237 알바", start: "11:00", end: "14:00", category: "아르바이트" } ] },
    { day: "토요일", activities: [ { name: "토요예배", category: "예배" } ] },
  ],
  weekly_goals: [
    { name: "뷰티 인스타", target: 1, period_weeks: 1 },
    { name: "일상 인스타", target: 1, period_weeks: 1 },
    { name: "인스타툰", target: 1, period_weeks: 2 },
  ],
};
const CATS = {
  "예배": "#ECE8F8", "개발": "#E2F0F4", "아르바이트": "#FBF0C9", "창작": "#EAF2DD", "음악": "#FCE6E1", "기타": "#F3EBDD",
};
function catColor(c){ return CATS[c] || CATS["기타"]; }
// 이름·분류로 연결할 스킬을 추천(사용자가 완료할 때 바꿀 수 있음)
function suggestChar(p){
  const n = p.name || "";
  if (/인스타툰/.test(n)) return "toon";
  if (/릴스|뷰티/.test(n)) return "reels";
  if (/일본어/.test(n)) return "jp";
  if (/드럼|합주|찬양/.test(n) || p.category === "음악") return "drum";
  return null;
}
function ensureSeed(){
  if (state.imports.includes(SEED_ID)) return false;
  const ts = Date.now();
  SEED.schedule.forEach(d => d.activities.forEach((a, i) => {
    state.plans.push({
      id: uid(), date: SEED.dates[d.day], name: a.name, category: a.category || "기타",
      start: a.start || null, end: a.end || null, durationMin: a.duration_minutes || null,
      needsReview: !!a.needs_review, status: "planned", charId: /인스타툰/.test(a.name) ? "toon" : null,
      recordId: null, memo: "", source: SEED_ID, ts: ts + i,
    });
  }));
  SEED.weekly_goals.forEach(g => state.goals.push({ id: uid(), name: g.name, target: g.target, periodWeeks: g.period_weeks, anchor: "2026-11-09", source: SEED_ID }));
  state.imports.push(SEED_ID);
  return true;
}
function toMin(t){ if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + (m || 0); }
function planMinutes(p){
  const a = toMin(p.start), b = toMin(p.end);
  if (a != null && b != null && b > a) return b - a;
  return p.durationMin || null;
}
function planTime(p){
  if (p.start && p.end) return `${p.start}~${p.end}`;
  if (p.start) return `${p.start}~`;
  if (p.durationMin) return `${fmtDur(p.durationMin)}`;
  return "시간 미정";
}
function plansOn(date){ return state.plans.filter(p => p.date === date).sort((a, b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999) || a.ts - b.ts); }
// 주간 목표(횟수): 기간 = anchor(월요일)부터 periodWeeks주 단위
function goalPeriod(g, date){
  const a = parseYmd(g.anchor || "2026-11-09"), d = mondayOf(parseYmd(date));
  const w = Math.floor(Math.round((d - a) / 86400000) / 7);
  const idx = Math.floor(w / (g.periodWeeks || 1));
  const start = new Date(a); start.setDate(start.getDate() + idx * 7 * (g.periodWeeks || 1));
  const end = new Date(start); end.setDate(end.getDate() + 7 * (g.periodWeeks || 1) - 1);
  return { start: ymd(start), end: ymd(end) };
}
function goalCount(g, per){ return state.goalLogs.filter(l => l.goalId === g.id && l.date >= per.start && l.date <= per.end).length; }

/* ============ 기본 시간표 (매주 반복) ============ */
// 11월 둘째 주 일정(사용자가 고친 내용 포함)을 기본 시간표로 만들고, 다음 주부터 날짜마다 한 번씩 채워 넣음
const TPL_ID = "template-v1";
const dowOf = date => (parseYmd(date).getDay() + 6) % 7;   // 0=월 … 6=일
const TPL_FIELDS = ["name", "category", "start", "end", "durationMin", "charId", "needsReview"];
function ensureTemplate(){
  if (state.imports.includes(TPL_ID)) return false;
  if (!state.template.length) {
    state.plans.filter(p => p.source === SEED_ID).forEach(p => {
      const t = { id: uid(), dow: dowOf(p.date) };
      TPL_FIELDS.forEach(k => t[k] = p[k] ?? null);
      t.needsReview = !!p.needsReview;
      state.template.push(t);
      p.templateId = t.id;
    });
  }
  state.templateFrom = state.templateFrom || "2026-11-08";
  Object.values(SEED.dates).forEach(d => { if (!state.filledDates.includes(d)) state.filledDates.push(d); });
  state.imports.push(TPL_ID);
  return true;
}
function planFromTemplate(t, date){
  const p = { id: uid(), date, status: "planned", recordId: null, memo: "", source: "template", templateId: t.id, ts: Date.now() };
  TPL_FIELDS.forEach(k => p[k] = t[k] ?? null);
  p.needsReview = !!t.needsReview;
  return p;
}
// 보이는 날짜(이번 주·보고 있는 주)에 기본 시간표를 채움. 한 번 채운 날은 다시 채우지 않음(지운 일정이 되살아나지 않게)
function fillFromTemplate(dates){
  if (!state.templateFrom) return false;
  const limit = (() => { const d = new Date(); d.setDate(d.getDate() + 70); return ymd(d); })();
  let changed = false;
  dates.forEach(date => {
    if (date < state.templateFrom || date > limit || state.filledDates.includes(date)) return;
    state.template.filter(t => t.dow === dowOf(date)).forEach(t => state.plans.push(planFromTemplate(t, date)));
    state.filledDates.push(date); changed = true;
  });
  return changed;
}
// 기본 시간표를 바꾸면: 오늘 이후, 아직 계획 상태이고 따로 고치지 않은 일정에도 반영
function syncTemplate(t, removed){
  const today = todayStr();
  const target = p => p.templateId === t.id && p.date >= today && p.status === "planned" && !p.custom;
  if (removed) { state.plans = state.plans.filter(p => !target(p)); return; }
  const have = new Set();
  state.plans.forEach(p => {
    if (p.templateId !== t.id || p.date < today) return;
    have.add(p.date);
    if (target(p)) {
      if (dowOf(p.date) !== t.dow) { p._drop = true; have.delete(p.date); return; }
      TPL_FIELDS.forEach(k => p[k] = t[k] ?? null); p.needsReview = !!t.needsReview;
    }
  });
  state.plans = state.plans.filter(p => !p._drop);
  state.filledDates.filter(d => d >= today && dowOf(d) === t.dow && !have.has(d)).forEach(d => state.plans.push(planFromTemplate(t, d)));
}
// 기본 정의 + 사용자가 바꾼 이름·목표
function ch(id){ const d = CHARS.find(c => c.id === id); return { ...d, ...(state.chars[id] || {}) }; }
function allChars(){ return CHARS.map(c => ch(c.id)); }

/* ============ 저장 ============ */
const Store = {
  ref: null, writing: false, dirty: false, mode: "local",
  async init(){
    let local = null;
    try { const raw = localStorage.getItem(KEY); if (raw) local = normalize(JSON.parse(raw)); } catch(e){}
    if (local) state = local;
    render();
    try {
      if (!window.claude || typeof claude.use !== "function") return;
      const db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.collection("data/users/" + id).doc("tamagotchi-v2");
      const d = unwrap(await withTimeout(this.ref.get(), 10000));
      this.mode = "cloud";
      if (d && d.state) {
        const remote = normalize(JSON.parse(d.state));
        if (!local || remote.updatedAt >= local.updatedAt) { state = remote; saveLocal(); } else this.push();
      } else if (local) this.push();
      render();
    } catch(e) { console.warn("db unavailable", e); this.ref = null; this.mode = "local"; render(); }
  },
  save(){ state.updatedAt = Date.now(); saveLocal(); this.push(); },
  async push(){
    if (!this.ref) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    try { await this.ref.set({ state: JSON.stringify(state), updatedAt: state.updatedAt }); } catch(e){ console.warn("save failed", e); }
    this.writing = false;
    if (this.dirty) { this.dirty = false; this.push(); }
  }
};
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function unwrap(s){ if (!s || s.exists === false) return null; return typeof s.data === "function" ? s.data() : s; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]); }

/* ============ 계산 ============ */
function recsOf(id){ return state.records.filter(r => r.charId === id); }
function minOn(id, date){ return recsOf(id).filter(r => r.date === date).reduce((a,r) => a + r.minutes, 0); }
function minWeek(id, monday){ const days = new Set(weekDays(monday)); return recsOf(id).filter(r => days.has(r.date)).reduce((a,r) => a + r.minutes, 0); }
// 경험치: 1분 = 1XP / 하루 목표 달성일 +20 / 주간 목표 달성 주 +100
function xpOf(id){
  const c = ch(id); let xp = 0; const byDay = {}, byWeek = {};
  for (const r of recsOf(id)) {
    xp += r.minutes;
    byDay[r.date] = (byDay[r.date] || 0) + r.minutes;
    const w = ymd(mondayOf(parseYmd(r.date))); byWeek[w] = (byWeek[w] || 0) + r.minutes;
  }
  for (const d in byDay) if (byDay[d] >= c.dailyGoal) xp += 20;
  for (const w in byWeek) if (byWeek[w] >= c.weeklyGoal) xp += 100;
  return Math.floor(xp);
}
function levelInfo(xp){ let lvl = 1, need = 60, rem = xp; while (rem >= need) { rem -= need; lvl++; need = 60 + (lvl-1) * 30; } return { level: lvl, cur: rem, need }; }
function stageOf(l){
  if (l <= 1) return { key: "seed", label: "씨앗", scale: .78 };
  if (l <= 3) return { key: "sprout", label: "새싹", scale: .85 };
  if (l <= 6) return { key: "leaf", label: "떡잎", scale: .92 };
  if (l <= 9) return { key: "bud", label: "꽃봉오리", scale: .97 };
  return { key: "bloom", label: "활짝", scale: 1 };
}
function allDone(date){ return CHARS.every(c => minOn(c.id, date) >= ch(c.id).dailyGoal); }
function timerOf(id){ return state.timer && state.timer.charId === id ? state.timer : null; }

/* 캐릭터 기분 → 포즈 */
function moodOf(id){
  const c = ch(id), today = todayStr(), hour = new Date().getHours();
  const recs = recsOf(id), t = minOn(id, today);
  const last = recs.reduce((m, r) => r.date > m ? r.date : m, "");
  const gap = last ? daysBetween(last, today) : null;
  if (timerOf(id)) return { pose: "focus", text: "집중하는 중… 🔥" };
  if (!recs.length) return { pose: "hi", text: `같이 ${c.skill} ${c.verb} 시작해볼까?` };
  if (t >= c.dailyGoal) return { pose: pick(["done1","done2","done3"]), text: "오늘 목표 달성! 최고야 ✨" };
  if (t > 0) return { pose: "base", text: "조금만 더 하면 목표야!" };
  if (hour >= 23 || hour < 6) return { pose: "sleep", text: "쿨쿨… 내일 만나…" };
  if (gap >= 3) return { pose: "cry", text: `${gap}일이나 못 봤어… 😢` };
  if (gap === 2) return { pose: "lazy", text: "심심해… 오늘은 같이 하자" };
  return { pose: "idle", text: "오늘도 같이 하자!" };
}

/* ============ 기록 + 달성 팝업 ============ */
function addRecord(id, minutes, date, memo, source, extra = {}){
  const c = ch(id);
  const before = levelInfo(xpOf(id)).level, beforeXP = xpOf(id);
  const monday = mondayOf(parseYmd(date));
  const dayBefore = minOn(id, date), weekBefore = minWeek(id, monday);
  state.records.push({ id: uid(), charId: id, date, minutes, memo, source, ts: Date.now(), ...extra });
  Store.save();

  const after = levelInfo(xpOf(id)).level, gained = xpOf(id) - beforeXP;
  const day = minOn(id, date), week = minWeek(id, monday);
  const dailyNew = day >= c.dailyGoal && dayBefore < c.dailyGoal, weeklyNew = week >= c.weeklyGoal && weekBefore < c.weeklyGoal;
  const pose = after > before ? "levelup" : weeklyNew ? "weekly" : dailyNew ? "done1" : "eat";
  const when = date === todayStr() ? "오늘은" : `${fmtMD(date)}에는`;
  const lines = [
    `➕ 방금 ${fmtDur(minutes)} 기록했어요`,
    day >= c.dailyGoal ? `🎯 하루 목표 ${fmtDur(c.dailyGoal)} ${dailyNew ? "달성!" : "이미 달성"}` : `🌱 하루 목표까지 ${fmtDur(c.dailyGoal - day)} 남았어요`,
    `📅 이번 주 ${fmtDur(week)} / ${fmtDur(c.weeklyGoal)}${weeklyNew ? " · 주간 목표 달성! 🎉" : ""}`,
  ];
  let lv = "";
  if (after > before) {
    const s0 = stageOf(before), s1 = stageOf(after);
    lv = `<div class="levelup">⬆️ ${esc(callName(c.name))}가 Lv.${after}로 자랐어요!${s0.key !== s1.key ? `<br>🌱 ${s1.label} 단계가 되었어요` : ""}</div>`;
  }
  ui.selectedDate = date;
  render();
  openModal(`<div class="pop-c" style="${charStyle(c)}">
    <div class="hero"><span class="prop">${c.prop}</span><img src="${SP(id, pose)}" alt=""></div>
    <div class="big">${esc(when)} ${esc(josa(c.skill, "을", "를"))}<br><em>${fmtDur(day)}</em> ${c.verb}했어요</div>
    <div class="lines">${lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>
    <span class="xp-chip">+${gained} XP</span>${lv}
  </div>`, { okLabel: pick(["좋아!", "고마워!", "계속 할래!"]) });
  if (dailyNew || weeklyNew || after > before) floaties(document.querySelector("#modal-root .hero"), weeklyNew ? "💕" : "✨");
}

/* --- 주간 시간표 (요일 × 시간) --- */
const DOW_EN = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const TT_ROW = 46;
function ttWeek(){ const m = mondayOf(new Date()); m.setDate(m.getDate() + ui.weekOffset * 7); return weekDays(m); }
function ttRange(plans){
  let lo = 9, hi = 22;
  plans.forEach(p => { const a = toMin(p.start), b = toMin(p.end) ?? (a != null && p.durationMin ? a + p.durationMin : null);
    if (a != null) lo = Math.min(lo, Math.floor(a / 60)); if (b != null) hi = Math.max(hi, Math.ceil(b / 60)); });
  return [Math.max(0, lo), Math.min(24, hi)];
}
function ttSpan(p){ const a = toMin(p.start); if (a == null) return null; const b = toMin(p.end) ?? (p.durationMin ? a + p.durationMin : a + 60); return [a, Math.max(b, a + 20)]; }
// 겹치는 일정은 나란히
function ttLanes(items){
  const lanes = []; items.sort((x, y) => x.span[0] - y.span[0]);
  items.forEach(it => { let i = lanes.findIndex(end => end <= it.span[0]); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = it.span[1]; it.lane = i; });
  items.forEach(it => { it.lanes = Math.max(1, ...items.filter(o => o.span[0] < it.span[1] && o.span[1] > it.span[0]).map(o => o.lane + 1)); });
  return items;
}
function viewTimetable(){

  const all = cols.flatMap(c => c.items);
  const [lo, hi] = ttRange(all), H = (hi - lo) * TT_ROW;
  const reviewN = all.filter(p => p.needsReview).length;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const attr = tpl ? "data-tpl" : "data-plan";
  const block = (p, it) => {
    const c = p.charId ? ch(p.charId) : null, done = p.status === "done";
    const style = it ? `top:${(it.span[0] - lo*60) / 60 * TT_ROW}px;height:${(it.span[1] - it.span[0]) / 60 * TT_ROW - 3}px;left:calc(${it.lane / it.lanes * 100}% + 2px);width:calc(${100 / it.lanes}% - 4px);` : "";
    return `<button class="tt-block ${it ? "" : "chip-b"} ${done ? "done" : ""} ${p.needsReview ? "review" : ""} ${tpl ? "tpl" : ""}" ${attr}="${p.id}" style="${style}background:${c ? c.bg : catColor(p.category)}">
      ${done ? `<span class="tt-stamp">✓</span>` : ""}${p.needsReview ? `<span class="tt-rv">!</span>` : ""}
      <span class="tt-name">${esc(p.name)}</span>
      ${it && (it.span[1] - it.span[0]) >= 50 ? `<span class="tt-time">${esc(planTime(p))}</span>` : (!it && p.durationMin ? `<span class="tt-time">${fmtDur(p.durationMin)}</span>` : "")}
    </button>`;
  };
  return `
  <h1>주간 시간표</h1>
  <div class="row" style="margin:6px 0 10px">
    <span class="chip ${tpl?"":"on"}" data-ttmode="week" style="${tpl?"":"background:var(--sage-pale)"}">📋 이번 주</span>
    <span class="chip ${tpl?"on":""}" data-ttmode="tpl" style="${tpl?"background:var(--butter-pale)":""}">🔁 기본 시간표 (매주 반복)</span>
  </div>
  <p class="muted" style="margin-bottom:10px">${tpl
    ? "여기서 고치면 앞으로의 주에 자동으로 들어가요. 이미 완료했거나 따로 고친 일정은 그대로 둬요."
    : "기본 시간표가 매주 자동으로 들어와요. 칸을 누르면 이번 주에만 일정 추가, 일정을 누르면 완료 체크·수정을 할 수 있어요."}</p>
  ${tpl ? `<div class="row" style="margin-bottom:8px"><button class="btn-sm" id="tt-ics" style="background:var(--blush-pale)">🔔 아이패드 캘린더 알림 만들기</button><span class="muted">앱을 꺼둬도 시작 시간에 알림이 와요</span></div>`
  : `<div class="week-nav" style="margin-bottom:6px">
    <button class="btn-sm" id="tt-prev" aria-label="이전 주">◀</button>
    <strong>${fmtMD(days[0])} ~ ${fmtMD(days[6])}</strong>
    <button class="btn-sm" id="tt-next" aria-label="다음 주" ${ui.weekOffset>=8?"disabled":""}>▶</button>
  </div>`}
  ${reviewN ? `<p class="review-note" style="margin:0 0 8px">⚠️ 확인이 필요한 일정이 ${reviewN}개 있어요. <span class="tt-rv" style="position:static;display:inline-flex">!</span> 표시를 눌러 고쳐주세요.${tpl ? "" : " 기본 시간표에서 고치면 다음 주부터는 안 떠요."}</p>` : ""}
  <div class="tt-scroll"><div class="tt-paper">
    <img class="tt-doodle" src="doodle.webp" alt="">
    <div class="tt ${tpl ? "is-tpl" : ""}">
      <div class="tt-corner">${tpl ? `<span class="tpl-tag">매주</span>` : ""}</div>
      ${cols.map(c => `<div class="tt-dh ${!tpl && c.date===today?"today":""} ${c.i>=5?"wk":""}"><b>${DOW_EN[c.i]}</b><span>${tpl ? DOW[c.i] + "요일" : parseYmd(c.date).getDate() + "일"}</span></div>`).join("")}
      <div class="tt-side small">종일</div>
      ${cols.map(c => `<div class="tt-allday" data-add-day="${c.key}">${c.items.filter(p => !p.start).map(p => block(p, null)).join("")}</div>`).join("")}
      <div class="tt-side"><div class="tt-hours" style="height:${H}px">${Array.from({length: hi - lo}, (_, k) => `<span style="top:${k*TT_ROW}px">${lo + k}</span>`).join("")}</div></div>
      ${cols.map(c => {
        const items = ttLanes(c.items.filter(p => p.start).map(p => ({ p, span: ttSpan(p) })));
        const isToday = !tpl && c.date === today;
        return `<div class="tt-col ${isToday?"today":""}" data-col="${c.key}" style="height:${H}px;background-size:100% ${TT_ROW}px">
          ${isToday && nowMin >= lo*60 && nowMin <= hi*60 ? `<div class="tt-now" style="top:${(nowMin - lo*60) / 60 * TT_ROW}px"></div>` : ""}
          ${items.map(it => block(it.p, it)).join("")}
        </div>`; }).join("")}
      ${tpl ? "" : `<div class="tt-side small">실제</div>
      ${days.map(d => { const ents = allChars().map(c => ({ c, n: minOn(c.id, d) })).filter(x => x.n > 0);
        return `<div class="tt-actual">${ents.map(x => `<span class="tt-act" style="background:${x.c.bg}">${esc(x.c.skill)} ${fmtShort(x.n)}</span>`).join("")}</div>`; }).join("")}`}
    </div>
  </div></div>
  <div class="row" style="margin-top:10px;gap:6px">
    ${Object.keys(CATS).map(k => `<span class="cat" style="background:${catColor(k)}">${k}</span>`).join("")}
    <span class="muted">· 점선 = 계획 · <b>✓</b> = 완료 · <span class="tt-rv" style="position:static;display:inline-flex">!</span> = 확인 필요${tpl ? "" : " · 실제 = 실제 기록 시간"}</span>
  </div>`;
}
function bindTimetable(){
  const tpl = ui.ttMode === "tpl";
  document.querySelectorAll("[data-ttmode]").forEach(b => b.onclick = () => { ui.ttMode = b.dataset.ttmode; render(); });
  if (!tpl) {
    document.getElementById("tt-prev").onclick = () => { ui.weekOffset--; render(); };
    document.getElementById("tt-next").onclick = () => { if (ui.weekOffset < 8) { ui.weekOffset++; render(); } };
  } else document.getElementById("tt-ics").onclick = exportICS;
  document.querySelectorAll("[data-plan]").forEach(b => b.onclick = e => { e.stopPropagation(); openPlanActions(b.dataset.plan); });
  document.querySelectorAll("[data-tpl]").forEach(b => b.onclick = e => { e.stopPropagation(); openTemplateForm(b.dataset.tpl); });
  const lo = (() => { const items = tpl ? state.template : state.plans.filter(p => ttWeek().includes(p.date)); return ttRange(items)[0]; })();
  const slot = key => key.startsWith("dow:") ? { dow: Number(key.slice(4)) } : { date: key };
  document.querySelectorAll("[data-col]").forEach(col => col.onclick = e => {
    if (e.target !== col) return;
    const h = Math.min(23, lo + Math.floor(e.offsetY / TT_ROW));
    const pre = { ...slot(col.dataset.col), start: `${pad(h)}:00`, end: h >= 23 ? "23:59" : `${pad(h + 1)}:00` };
    tpl ? openTemplateForm(null, pre) : openPlanForm(null, pre);
  });
  document.querySelectorAll("[data-add-day]").forEach(c => c.onclick = e => { if (e.target !== c) return; const pre = slot(c.dataset.addDay); tpl ? openTemplateForm(null, pre) : openPlanForm(null, pre); });
  const sc = document.querySelector(".tt-scroll"), td = document.querySelector(".tt-dh.today");
  if (sc && td && sc.scrollWidth > sc.clientWidth) sc.scrollLeft = Math.max(0, td.offsetLeft - 60);
}

/* --- 기본 시간표 항목 추가·수정 --- */

      <div class="row">
        <div class="grow"><label for="tf-start">시작</label><input type="time" id="tf-start" value="${v.start}"></div>
        <div class="grow"><label for="tf-end">끝</label><input type="time" id="tf-end" value="${v.end}"></div>
        <div class="grow"><label for="tf-dur">또는 걸리는 시간(분)</label><input type="number" id="tf-dur" min="0" inputmode="numeric" value="${v.dur}"></div>
      </div>
      <label>분류</label>
      <div class="row">${Object.keys(CATS).map(k => `<span class="chip ${k===cat?"on":""}" data-cat="${k}" style="${k===cat?`background:${catColor(k)}`:""}">${k}</span>`).join("")}</div>
      <label>연결할 스킬 <span class="muted">(완료하면 이 스킬 경험치로 들어가요)</span></label>
      <div class="row"><span class="chip ${!charId?"on":""}" data-ch="">없음</span>${allChars().map(c => `<span class="chip ${c.id===charId?"on":""}" data-ch="${c.id}" style="${c.id===charId?`background:${c.bg}`:""}"><span class="dot" style="background:${c.main}"></span>${esc(c.skill)}</span>`).join("")}</div>
      ${t?.needsReview ? `<label class="row" style="gap:8px;color:var(--ink);font-size:15px;margin-top:14px"><input type="checkbox" id="tf-reviewed" ${v.reviewed?"checked":""} style="width:22px;height:22px"> 내용을 확인했어요</label>` : ""}
      <div class="err" id="tf-err"></div>
      <div class="row" style="margin-top:4px">
        ${t ? `<button class="btn-danger" id="tf-del" style="border:2px solid #E5B3AA">✕ 기본 시간표에서 빼기</button>` : ""}
        <button class="btn-primary grow" id="tf-save">저장하기</button>

    box.querySelector("[data-close]").onclick = close;
    box.querySelectorAll("[data-dow]").forEach(x => x.onclick = () => { const k = read(); dow = Number(x.dataset.dow); draw(k); });
    box.querySelectorAll("[data-cat]").forEach(x => x.onclick = () => { const k = read(); cat = x.dataset.cat; draw(k); });
    box.querySelectorAll("[data-ch]").forEach(x => x.onclick = () => { const k = read(); charId = x.dataset.ch || null; draw(k); });
    const del = box.querySelector("#tf-del");
    if (del) del.onclick = () => { close(); confirmModal(`'${t.name}'을(를) 기본 시간표에서 뺄까요? 다음 주부터 안 나와요. 지난 기록과 완료한 일정은 그대로 둬요.`, "빼기", () => {
      state.template = state.template.filter(x => x.id !== t.id); syncTemplate(t, true); Store.save(); render(); }, "toon", "think"); };
    box.querySelector("#tf-save").onclick = () => {
      const f = read(), err = box.querySelector("#tf-err");
      if (!f.name.trim()) { err.textContent = "무엇을 하는지 적어주세요."; return; }
      if (f.start && f.end && toMin(f.end) <= toMin(f.start)) { err.textContent = "끝나는 시간이 시작보다 늦어야 해요."; return; }
      const data = { name: f.name.trim(), dow, start: f.start || null, end: f.end || null, durationMin: Number(f.dur) > 0 ? Math.round(Number(f.dur)) : null, category: cat, charId };

      if (t) { Object.assign(t, data); if (t.needsReview && f.reviewed) t.needsReview = false; }
      else { item = { id: uid(), ...data, needsReview: false }; state.template.push(item); }
      syncTemplate(item, false);
      Store.save(); close(); render();
    };
  };
  draw();
}

/* --- 아이패드 캘린더 알림(.ics): 앱을 꺼둬도 시작 시간에 알림 --- */
function exportICS(){
  const items = state.template.filter(t => t.start);
  if (!items.length) { openModal(`<p>시간이 정해진 기본 일정이 없어요.</p>`); return; }
  const z = n => String(n).padStart(2, "0");
  const stamp = (() => { const d = new Date(); return `${d.getUTCFullYear()}${z(d.getUTCMonth()+1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}00Z`; })();
  const nextDate = dow => { const d = new Date(); d.setHours(0,0,0,0); while ((d.getDay() + 6) % 7 !== dow) d.setDate(d.getDate() + 1); return d; };
  const fmt = (d, hm) => `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${hm.replace(":", "")}00`;
  const escI = t => String(t).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//growth-tamagotchi//KO", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:다마고치 시간표",
    "BEGIN:VTIMEZONE", "TZID:Asia/Seoul", "BEGIN:STANDARD", "DTSTART:19700101T000000", "TZOFFSETFROM:+0900", "TZOFFSETTO:+0900", "TZNAME:KST", "END:STANDARD", "END:VTIMEZONE"];
  items.forEach(t => {
    const d = nextDate(t.dow), endHM = t.end || (() => { const m = toMin(t.start) + (t.durationMin || 60); return `${z(Math.min(23, Math.floor(m/60)))}:${z(m%60)}`; })();
    lines.push("BEGIN:VEVENT", `UID:tamagotchi-${t.id}@growth-tamagotchi`, `DTSTAMP:${stamp}`,
      `DTSTART;TZID=Asia/Seoul:${fmt(d, t.start)}`, `DTEND;TZID=Asia/Seoul:${fmt(d, endHM)}`, "RRULE:FREQ=WEEKLY",
      `SUMMARY:${escI(t.name)}`, `DESCRIPTION:${escI("지금은 " + t.name + " 시간이에요 🌱")}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT0M", `DESCRIPTION:${escI("지금은 " + t.name + " 시간이에요")}`, "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "다마고치-시간표.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  openModal(`<div class="pop-c"><div class="hero"><img src="${SP("toon","hi")}" alt="" style="width:100px;height:100px"></div>
    <div class="big" style="font-size:22px">캘린더 파일을 만들었어요</div>
    <div class="lines"><p>1. 뜨는 화면에서 <b>모두 추가</b>를 누르면 아이패드 캘린더에 매주 반복 일정 ${items.length}개가 들어가요.</p>
    <p>2. 시작 시간마다 알림이 와요. 앱을 꺼둬도 와요.</p>
    <p>3. 안 열리면 <b>파일</b> 앱의 다운로드에서 파일을 눌러주세요.</p>
    <p class="muted">기본 시간표를 바꾸면 캘린더 일정은 직접 고치거나 다시 만들어야 해요.</p></div></div>`);
}

/* --- 달력: 한 달 기록만 간단하게 --- */
// 기록이 언제였는지: 직접 적은 시작 시간 > 완료한 일정의 시간 > 타이머 끝난 시각
function recSpan(r){
  let a = toMin(r.start);
  if (a == null && r.planId) { const p = state.plans.find(x => x.id === r.planId); if (p) a = toMin(p.start); }
  if (a == null && r.source === "timer" && r.ts && ymd(new Date(r.ts)) === r.date) { const e = new Date(r.ts); a = e.getHours() * 60 + e.getMinutes() - r.minutes; }
  if (a == null) return null;
  a = Math.max(0, a);
  return [a, Math.min(24 * 60, a + Math.max(r.minutes, 15))];
}
const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
function monthDays(offset){
  const n = new Date(), first = new Date(n.getFullYear(), n.getMonth() + offset, 1);
  const start = mondayOf(first), last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const days = []; const d = new Date(start);
  while (d <= last || days.length % 7) { days.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return { first, days };
}
function viewCalendar(){
  const { first, days } = monthDays(ui.monthOffset || 0), today = todayStr(), mo = first.getMonth();
  const inMonth = d => parseYmd(d).getMonth() === mo;
  const monthRecs = state.records.filter(r => inMonth(r.date) && days.includes(r.date));
  const total = monthRecs.reduce((a, r) => a + r.minutes, 0), activeDays = new Set(monthRecs.map(r => r.date)).size;
  return `
  <h1>달력</h1>
  <div class="card mcal-card">
    <div class="week-nav">
      <button class="btn-sm" id="m-prev" aria-label="이전 달">◀</button>
      <strong>${first.getFullYear()}년 ${mo + 1}월</strong>
      <button class="btn-sm" id="m-next" aria-label="다음 달">▶</button>
    </div>
    <p class="muted" style="text-align:center;margin:-4px 0 10px">이번 달 ${fmtDur(total)} · 기록한 날 ${activeDays}일</p>
    <div class="mcal">
      ${DOW.map((d, i) => `<div class="mdow ${i >= 5 ? "wk" : ""}">${d}</div>`).join("")}
      ${days.map(d => {
        const ents = allChars().map(c => ({ c, n: minOn(c.id, d) })).filter(x => x.n > 0);
        return `<button class="mday ${inMonth(d) ? "" : "out"} ${d === today ? "today" : ""}" data-mday="${d}" aria-label="${fmtMD(d)} 기록 보기">
          <span class="mdn">${parseYmd(d).getDate()}</span>
          ${ents.map(x => `<span class="mchip" style="background:${x.c.bg}"><i style="background:${x.c.main}"></i><span class="mlbl">${esc(x.c.skill)} </span>${fmtShort(x.n)}</span>`).join("")}
        </button>`;
      }).join("")}
    </div>
  </div>`;
}
function bindCalendar(){
  document.getElementById("m-prev").onclick = () => { ui.monthOffset = (ui.monthOffset || 0) - 1; render(); };
  document.getElementById("m-next").onclick = () => { ui.monthOffset = (ui.monthOffset || 0) + 1; render(); };

// 날짜를 누르면: 그날 기록한 스킬을 시간표처럼
function openDayDetail(date){
  const close = openModal("", { sheet: true });
  const box = document.querySelector("#modal-root .modal");
  const draw = () => {
    const recs = state.records.filter(r => r.date === date).sort((a, b) => (recSpan(a)?.[0] ?? 9999) - (recSpan(b)?.[0] ?? 9999) || a.ts - b.ts);
    const total = recs.reduce((a, r) => a + r.minutes, 0);
    const timed = recs.map(r => ({ r, span: recSpan(r) })).filter(x => x.span), untimed = recs.filter(r => !recSpan(r));
    let lo = 24, hi = 0; timed.forEach(x => { lo = Math.min(lo, Math.floor(x.span[0] / 60)); hi = Math.max(hi, Math.ceil(x.span[1] / 60)); });
    if (timed.length) { lo = Math.min(lo, Math.max(0, hi - 4)); hi = Math.max(hi, lo + 4); }
    const ROW = 44, lanes = ttLanes(timed.map(x => ({ ...x })));
    const dd = parseYmd(date);
    const sum = allChars().map(c => ({ c, n: minOn(c.id, date) })).filter(x => x.n > 0);
    box.innerHTML = `<button class="close-x" data-close aria-label="닫기">✕</button>
      <h2 style="margin-bottom:2px">${fmtMD(date)} (${DOW[(dd.getDay() + 6) % 7]})</h2>
      <p class="muted">${recs.length ? `총 ${fmtDur(total)} 기록했어요` : ""}</p>
      ${recs.length ? `
      <div class="row" style="margin:10px 0 4px">${sum.map(x => `<span class="dchip" style="background:${x.c.bg}"><img src="${SP(x.c.id, "idle")}" alt="">${esc(x.c.skill)} <b>${fmtDur(x.n)}</b></span>`).join("")}</div>
      ${timed.length ? `<div class="dtl" style="height:${(hi - lo) * ROW}px">
        <div class="dtl-hours">${Array.from({ length: hi - lo }, (_, k) => `<span style="top:${k * ROW}px">${lo + k}</span>`).join("")}</div>
        <div class="dtl-col" style="background-size:100% ${ROW}px">
          ${lanes.map(it => { const c = ch(it.r.charId), h = (it.span[1] - it.span[0]) / 60 * ROW - 3;
            return `<div class="dtl-b" style="top:${(it.span[0] - lo * 60) / 60 * ROW}px;height:${h}px;left:calc(${it.lane / it.lanes * 100}% + 3px);width:calc(${100 / it.lanes}% - 6px);background:${c.bg};border-color:${c.main}">
              ${h >= 30 ? `<img src="${SP(c.id, "base")}" alt="">` : ""}
              <div><b>${esc(c.skill)}</b> <span class="muted">${hm(it.span[0])}~${hm(it.span[0] + it.r.minutes)} · ${fmtDur(it.r.minutes)}</span>${h >= 44 && it.r.memo ? `<br><span class="muted">${esc(it.r.memo)}</span>` : ""}</div>
            </div>`; }).join("")}
        </div>
      </div>` : ""}
      ${untimed.length ? `<p class="muted" style="margin:12px 0 2px">시간이 기록되지 않은 활동</p>` : ""}
      <div>${untimed.map(r => recRow(r)).join("")}</div>
      <details class="dtl-list"><summary>기록 목록 · 지우기</summary>${recs.map(r => recRow(r, true)).join("")}</details>`
      : `<div class="empty"><img src="${SP("toon", date > todayStr() ? "think" : "empty")}" alt=""><p class="muted">${date > todayStr() ? "아직 오지 않은 날이에요" : "이 날은 기록한 스킬이 없어요"}</p></div>`}
      ${date <= todayStr() ? `<button class="btn-block" id="dd-add" style="margin-top:14px;background:var(--sage-pale)">＋ 이 날 기록 추가</button>` : ""}`;
    box.querySelector("[data-close]").onclick = close;
    const add = box.querySelector("#dd-add"); if (add) add.onclick = () => { close(); openManualSheet(null, date); };
    box.querySelectorAll("[data-delrec]").forEach(b => b.onclick = () => {
      const r = state.records.find(x => x.id === b.dataset.delrec);
      if (b.dataset.armed) {
        state.records = state.records.filter(x => x.id !== r.id);
        state.plans.forEach(p => { if (p.recordId === r.id) { p.recordId = null; p.status = "planned"; } });
        Store.save(); render(); draw();
      } else { b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 삭제"; }
    });
  };
  draw();
}
function recRow(r, del){
  const c = ch(r.charId), sp = recSpan(r);
  return `<div class="list-item">
    <img src="${SP(c.id, "idle")}" alt="" style="width:34px;height:34px;object-fit:contain">
    <div class="grow"><strong>${esc(c.skill)}</strong> <span class="muted">${sp ? `${hm(sp[0])}~ · ` : ""}${r.source === "timer" ? "⏱ 타이머" : r.planId ? "📋 일정 완료" : "직접 입력"}</span>${r.memo ? `<br><span class="muted">${esc(r.memo)}</span>` : ""}</div>
    <span class="amt">${fmtDur(r.minutes)}</span>
    ${del ? `<button class="btn-sm btn-danger" data-delrec="${r.id}">✕</button>` : ""}
  </div>`;
}

/* --- 일정 완료 체크 → 실제 기록(경험치는 여기서만) --- */
function togglePlan(id){
  const p = state.plans.find(x => x.id === id);
  if (p.status === "done") {
    const rec = p.recordId && state.records.find(r => r.id === p.recordId);
    confirmModal(rec ? `완료를 취소할까요? 함께 남긴 ${ch(rec.charId).skill} 기록 ${fmtDur(rec.minutes)}과 경험치도 빠져요.` : "완료를 취소할까요?", "완료 취소", () => {
      if (rec) state.records = state.records.filter(r => r.id !== rec.id);
      p.status = "planned"; p.recordId = null; Store.save(); render();
    }, rec ? rec.charId : "toon", "think");
    return;
  }
  if (p.date > todayStr()) { openModal(`<div class="pop-c"><div class="hero"><img src="${SP("toon","think")}" alt="" style="width:110px;height:110px"></div><p style="font-size:16px">아직 오지 않은 날이에요.<br>그날이 되면 완료를 체크할 수 있어요.</p></div>`); return; }
  let sel = p.charId || suggestChar(p);
  const mins0 = planMinutes(p) || 30;
  const close = openModal("", { bare: true });
  const box = document.querySelector("#modal-root .modal");
  const draw = keepMin => {
    const c = sel ? ch(sel) : null;

      <div class="big" style="font-size:22px">'${esc(p.name)}'<br>실제로 했나요?</div>
      ${p.needsReview ? `<p class="review-note">⚠️ 확인 필요한 일정이에요. <button class="rv-badge" id="tp-edit">내용 고치기</button></p>` : ""}
      <p class="muted" style="margin-bottom:6px">어떤 스킬로 기록할까요?</p>
      <div class="row" style="justify-content:center"><span class="chip ${!sel?"on":""}" data-s="">스킬 아님</span>${allChars().map(x => `<span class="chip ${x.id===sel?"on":""}" data-s="${x.id}" style="${x.id===sel?`background:${x.bg}`:""}"><span class="dot" style="background:${x.main}"></span>${esc(x.skill)}</span>`).join("")}</div>
      ${c ? `<p class="muted" style="margin-top:10px">실제로 ${esc(c.skill)} ${c.verb}한 시간</p>${durInputHTML(keepMin ?? mins0)}` : `<p class="muted" style="margin-top:10px">스킬이 아닌 일정은 완료 표시만 하고 경험치는 없어요.</p>`}
      <div class="err" id="tp-err"></div>
      <div class="actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="tp-save">완료했어요</button></div>
    </div>`;
    box.querySelectorAll("[data-close]").forEach(b => b.onclick = close);

      const d = Math.round(Number(document.getElementById("d-"+c.id).value));
      const w = Math.round(Number(document.getElementById("w-"+c.id).value) * 60);
      if (!name) { err.textContent = `${c.name}의 이름을 입력해 주세요.`; return; }
      if (!(d > 0) || !(w > 0)) { err.textContent = `${c.name}의 목표를 1 이상으로 입력해 주세요.`; return; }
      next[c.id] = { name, skill, verb, dailyGoal: d, weeklyGoal: w };
    }
    state.chars = next; Store.save(); render();
    openModal(`<div class="pop-c" style="${charStyle(ch("jp"))}"><div class="hero"><img src="${SP("toon","done1")}" alt="" style="width:110px;height:110px"></div><div class="big" style="font-size:23px">저장했어요!</div></div>`);
  };
  document.getElementById("backup-save").onclick = () => {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `다마고치-백업-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch(e) { openModal(`<p>백업 파일을 만들지 못했어요.</p>`); }
  };
  const fileIn = document.getElementById("backup-file");
  document.getElementById("backup-load").onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; if (!f) return;
    try {
      const data = normalize(JSON.parse(await f.text()));
      confirmModal(`백업(기록 ${data.records.length}개)으로 지금 기록을 바꿀까요? 지금 기록은 사라져요.`, "불러오기", () => {
        state = data; Store.save(); render();
      }, "jp", "think");
    } catch(e) { openModal(`<p>백업 파일을 읽지 못했어요.</p>`); }
    fileIn.value = "";
  };
  document.getElementById("reset").onclick = () => confirmModal("모든 친구의 기록과 레벨이 사라져요. 정말 지울까요?", "모두 지우기", () => {
    state.records = []; state.timer = null; Store.save(); render();
  }, "jp", "cry");
}

/* ============ 공통 ============ */
function openModal(html, opts = {}){
  const root = document.getElementById("modal-root");
  const footer = (opts.sheet || opts.bare) ? "" : `<div class="row" style="margin-top:18px;justify-content:center">${opts.buttons || `<button class="btn-primary" data-close style="min-width:140px">${opts.okLabel || "확인"}</button>`}</div>`;
  root.innerHTML = `<div class="overlay ${opts.sheet ? "sheet" : ""}" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}${footer}</div></div>`;
  const close = () => { root.innerHTML = ""; };
  root.querySelector("#ov").onclick = e => { if (e.target.id === "ov") close(); };
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  tick();
  return close;
}
function confirmModal(msg, yes, onYes, charId, pose){
  const c = ch(charId || "jp");
  const close = openModal(`<div class="pop-c" style="${charStyle(c)}"><div class="hero"><img src="${SP(c.id, pose || "think")}" alt="" style="width:110px;height:110px"></div><p style="font-size:16px;margin-top:8px">${esc(msg)}</p></div>`,
    { buttons: `<button class="btn-ghost" data-close>취소</button><button class="btn-pink" id="m-yes">${esc(yes)}</button>` });
  document.getElementById("m-yes").onclick = () => { close(); onYes(); };
}
function floaties(el, chr){
  if (!el) return;
  for (let i = 0; i < 3; i++) {
    const f = document.createElement("span"); f.className = "floaty"; f.textContent = chr;
    f.style.left = (30 + Math.random()*40) + "%"; f.style.top = (25 + Math.random()*25) + "%"; f.style.animationDelay = (i*0.15) + "s";
    el.appendChild(f); setTimeout(() => f.remove(), 2000);
  }
}
function tick(){ if (!state.timer) return; const t = fmtClock(Date.now() - state.timer.startedAt); document.querySelectorAll("[data-timer]").forEach(e => e.textContent = t); }
setInterval(tick, 1000);
/* ============ 지금은 무슨 시간? (시간표 따라 팝업) ============ */
function nowInfo(){
  const today = todayStr(), n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const timed = plansOn(today).filter(p => p.start).map(p => ({ p, span: ttSpan(p) }));
  const current = timed.filter(x => x.span[0] <= m && m < x.span[1]);
  const next = timed.filter(x => x.span[0] > m).sort((a, b) => a.span[0] - b.span[0])[0] || null;
  const ended = timed.filter(x => x.span[1] <= m && m - x.span[1] <= 180 && x.p.status === "planned");
  return { m, current, next, ended };
}
const ANN_KEY = "tg-announced";
function annLoad(){ try { return JSON.parse(localStorage.getItem(ANN_KEY) || "{}"); } catch(e) { return {}; } }
function annSave(o){ try { const t = todayStr(); Object.keys(o).forEach(k => { if (!k.includes(t)) delete o[k]; }); localStorage.setItem(ANN_KEY, JSON.stringify(o)); } catch(e) {} }
let toastTimer = null;
function toast(html){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.innerHTML = html; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 6000);
  el.onclick = () => el.classList.remove("show");
}
function checkNow(opening){
  if (document.hidden) return;
  if (document.querySelector("#modal-root .overlay")) return;   // 다른 창이 열려 있으면 다음에
  const { m, current, next, ended } = nowInfo(), today = todayStr(), ann = annLoad(), nowTs = Date.now();
  // 1) 지금 시작된(진행 중인) 일정: 처음 한 번 + 앱을 다시 열면 1시간마다
  const cur = current.find(x => { const k = `s:${today}:${x.p.id}`; return !ann[k] || (opening && nowTs - ann[k] > 60 * 60000); });
  if (cur) { ann[`s:${today}:${cur.p.id}`] = nowTs; annSave(ann); showNowPopup(cur, next); return; }
  // 2) 방금 끝난 일정: 했는지 물어보기 (한 번만)
  const end = ended.find(x => !ann[`e:${today}:${x.p.id}`]);
  if (end) { ann[`e:${today}:${end.p.id}`] = nowTs; annSave(ann); showEndPopup(end); return; }
  // 3) 앱을 열었는데 지금 일정이 없으면 짧은 안내만
  if (opening && !current.length) toast(next ? `🌿 지금은 자유 시간 · 다음은 <b>${esc(next.p.name)}</b> ${next.p.start}` : `🌿 지금은 자유 시간이에요`);
}
function showNowPopup(x, next){
  const p = x.p, c = p.charId ? ch(p.charId) : null, left = x.span[1] - nowInfo().m;
  const close = openModal(`<div class="pop-c" style="${c ? charStyle(c) : ""}">
    <div class="muted">⏰ ${new Date().getHours()}:${pad(new Date().getMinutes())}</div>
    <div class="hero"><img src="${SP(c ? c.id : "toon", c ? "focus" : "hi")}" alt=""></div>
    <div class="big">지금은<br><em>${esc(p.name)}</em> 시간이에요</div>
    <div class="lines">
      <p>🕐 ${esc(planTime(p))} · ${left > 0 ? `끝나기까지 ${fmtDur(left)}` : "곧 끝나요"}</p>
      ${c ? `<p>${c.prop} 완료하면 ${esc(c.skill)} 경험치가 들어가요</p>` : ""}
      ${p.needsReview ? `<p>⚠️ 확인이 필요한 일정이에요</p>` : ""}
      ${next ? `<p class="muted">다음: ${esc(next.p.name)} ${next.p.start}</p>` : ""}
    </div>
    <div class="actions">
      ${c && !state.timer ? `<button class="btn-primary" id="np-timer">▶ 타이머 시작</button>` : `<button id="np-tt">🗓 시간표 보기</button>`}
      <button ${c && !state.timer ? "" : 'class="btn-primary"'} data-close>알겠어요</button>
    </div></div>`, { bare: true });
  floaties(document.querySelector("#modal-root .hero"), "⏰");
  const t = document.getElementById("np-timer"); if (t) t.onclick = () => { close(); startTimer(c.id); };
  const g = document.getElementById("np-tt"); if (g) g.onclick = () => { close(); ui.tab = "tt"; ui.ttMode = "week"; ui.weekOffset = 0; render(); };
}
function showEndPopup(x){
  const p = x.p, c = p.charId ? ch(p.charId) : null;
  const close = openModal(`<div class="pop-c" style="${c ? charStyle(c) : ""}">
    <div class="hero"><img src="${SP(c ? c.id : "toon", "think")}" alt=""></div>
    <div class="big" style="font-size:24px"><em>${esc(p.name)}</em><br>시간이 끝났어요. 했나요?</div>
    <p class="muted">${esc(planTime(p))}${c ? ` · 완료하면 ${esc(c.skill)} 경험치` : ""}</p>
    <div class="actions"><button data-close>나중에</button><button class="btn-primary" id="ep-done">○ 완료 체크</button></div>
  </div>`, { bare: true });
  document.getElementById("ep-done").onclick = () => { close(); togglePlan(p.id); };
}
setInterval(() => checkNow(false), 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(() => checkNow(true), 600); });

document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

Store.init();
setTimeout(() => checkNow(true), 1200);
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e)));
}
</script>
