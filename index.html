/* ============ 🥁 둥둥이 메트로놈: 곡 템포로 박자 틀고 연습 ============ */
// 곡 템포: 이 콘티에서 정한 값 > 예전에 같은 곡에 저장한 값
function songBpm(s){
  if (s.bpm) return { bpm: s.bpm, src: "이번 콘티" };
  const saved = W().bpm[wsNorm(s.q)]; return saved ? { bpm: saved, src: "지난번에 저장" } : null;
}
let metro = null;   // 지금 울리는 메트로놈 (한 번에 하나)
function metroStop(){
  if (!metro) return;
  clearInterval(metro.timer); metro.timers.forEach(clearTimeout);
  try { metro.ctx.close(); } catch(e) {}
  metro = null;
}
function metroStart(getCfg, onBeat){
  metroStop();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC(); ctx.resume && ctx.resume();
  const m = metro = { ctx, timer: null, timers: [], next: ctx.currentTime + .08, idx: 0 };
  const click = (time, kind) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = kind === 2 ? 1760 : kind === 1 ? 1100 : 760;
    g.gain.setValueAtTime(kind === 0 ? .25 : .6, time); g.gain.exponentialRampToValueAtTime(.0008, time + .045);
    o.connect(g); g.connect(ctx.destination); o.start(time); o.stop(time + .05);
  };
  m.timer = setInterval(() => {
    const c = getCfg(), sub = c.sub, per = 60 / c.bpm / sub;
    while (m.next < ctx.currentTime + .12) {
      const beat = Math.floor(m.idx / sub) % c.beats, onBeat0 = m.idx % sub === 0;
      click(m.next, onBeat0 ? (beat === 0 && c.accent ? 2 : 1) : 0);
      if (onBeat0) { const at = (m.next - ctx.currentTime) * 1000; m.timers.push(setTimeout(() => onBeat(beat), Math.max(0, at))); if (m.timers.length > 40) m.timers.splice(0, 20); }
      m.next += per; m.idx++;
    }
  }, 25);
}

/* 마이크로 들어서 템포 찾기 (12초) */
async function listenBpm(seconds, onProgress){
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
  await (ctx.resume ? ctx.resume() : null);
  const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(1024, 1, 1), chunks = [];
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  const sr = ctx.sampleRate, t0 = Date.now();
  await new Promise(res => { const iv = setInterval(() => { const p = (Date.now() - t0) / 1000 / seconds; onProgress && onProgress(Math.min(1, p)); if (p >= 1) { clearInterval(iv); res(); } }, 200); });
  proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop()); ctx.close();
  const len = chunks.reduce((a, c) => a + c.length, 0), x = new Float32Array(len); let o = 0; chunks.forEach(c => { x.set(c, o); o += c.length; });
  return estimateBpm(x, sr);
}
function estimateBpm(x, sr){
  // 1) 짧은 구간마다 소리 크기 → 커지는 순간(박)만 남기기
  const hop = Math.round(sr * .005), win = hop * 4, env = [];
  let prev = 0, hp = 0, lastX = 0;
  for (let i = 0; i + win < x.length; i += hop) {
    let e = 0;
    for (let k = i; k < i + win; k++) { hp = .9 * (hp + x[k] - lastX); lastX = x[k]; e += hp * hp; }   // 낮은 웅웅거림 줄이기
    const v = Math.log(1 + 1000 * e / win), d = v - prev; prev = v; env.push(d > 0 ? d : 0);
  }
  const n = env.length; if (n < 300) return null;
  const mean = env.reduce((a, b) => a + b, 0) / n, z = env.map(v => v - mean);
  // 2) 박 간격 찾기(자기상관), 60~180 BPM, 110 근처를 조금 선호
  const fps = sr / hop, score = [];
  for (let bpm = 50; bpm <= 190; bpm += .25) {
    const lag = fps * 60 / bpm, l0 = Math.floor(lag), f = lag - l0; let s = 0;
    for (let i = 0; i + l0 + 1 < n; i++) s += z[i] * (z[i + l0] * (1 - f) + z[i + l0 + 1] * f);
    const w = Math.exp(-.5 * Math.pow(Math.log2(bpm / 110) / 0.9, 2));
    score.push({ bpm, s: s / (n - l0) * (.6 + .4 * w) });
  }
  const at = b => score.reduce((m, x) => Math.abs(x.bpm - b) < Math.abs(m.bpm - b) ? x : m, score[0]);
  const near = b => { const c = at(b); return score.filter(x => Math.abs(x.bpm - c.bpm) <= 2).reduce((m, x) => x.s > m.s ? x : m, c); };
  score.sort((a, b) => b.s - a.s);
  let best = score[0];
  // 킥이 1·3박에만 있으면 절반 빠르기로 잡히기 쉬워요 → 두 배 쪽도 강하면 두 배로
  if (best.bpm < 92) { const d = near(best.bpm * 2), r = d.s / best.s; if (d.bpm <= 185 && (best.bpm < 64 ? r > .3 : r > .72)) best = d; }
  const alt = [near(best.bpm * 2), near(best.bpm / 2)].filter(x => x.bpm >= 50 && x.bpm <= 190 && Math.abs(x.bpm - best.bpm) > 10).sort((a, b) => b.s - a.s)[0];
  const peak = Math.max(...z), clear = best.s > 0 ? Math.min(1, best.s / (peak * peak / 50 + 1e-9)) : 0;
  return { bpm: Math.round(best.bpm), alt: alt ? Math.round(alt.bpm) : null, clear };
}

      ${opts.onSave ? `<button class="btn-block" id="mt-save" style="margin-top:8px;background:#FFE9A8">💾 이 곡 템포로 저장 (${cfg.bpm} BPM)</button>` : ""}
    </div>`;
    bind();
  };
  const setBpm = v => { cfg.bpm = Math.max(40, Math.min(240, Math.round(v))); const n = box.querySelector("#mt-num"); if (n) n.textContent = cfg.bpm; const r = box.querySelector("#mt-range"); if (r) r.value = cfg.bpm; const sv = box.querySelector("#mt-save"); if (sv) sv.textContent = `💾 이 곡 템포로 저장 (${cfg.bpm} BPM)`; };
  const onBeat = beat => {
    box.querySelectorAll("[data-dot]").forEach(d => d.classList.toggle("on", +d.dataset.dot === beat));
    const dd = box.querySelector("#mt-dd"); if (dd) { dd.classList.remove("hit"); void dd.offsetWidth; dd.classList.add("hit"); }
  };
  const bind = () => {
    box.querySelector("[data-close]").onclick = close;
    const vb = box.querySelector("#mt-vid");
    if (vb) vb.onclick = () => {
      videoOn = !videoOn;
      vbox.innerHTML = videoOn ? `<iframe src="https://www.youtube.com/embed/${opts.video.id}?start=${opts.video.t}&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="찬양 영상"></iframe>` : "";
      draw();
    };
    box.querySelectorAll("[data-mt-d]").forEach(b => b.onclick = () => setBpm(cfg.bpm + +b.dataset.mtD));
    // ＋/− : 톡 누르면 1씩, 길게 누르고 있으면 10씩 계속 (1초쯤 지나면 두 배 빠르게)
    box.querySelectorAll("[data-mt-hold]").forEach(b => {
      const dir = +b.dataset.mtHold; let t = null, n = 0;
      const stop = () => { clearTimeout(t); t = null; b.classList.remove("holding"); };
      const rep = () => { setBpm(cfg.bpm + dir * 10); n++; t = setTimeout(rep, n < 5 ? 260 : 130); };
      b.onpointerdown = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_) {} n = 0; b.classList.add("holding"); setBpm(cfg.bpm + dir); t = setTimeout(rep, 450); };
      b.onpointerup = b.onpointercancel = b.onlostpointercapture = stop;
      b.oncontextmenu = e => e.preventDefault();
    });
    box.querySelectorAll("[data-mt-x]").forEach(b => b.onclick = () => setBpm(cfg.bpm * +b.dataset.mtX));
    box.querySelector("#mt-range").oninput = e => setBpm(+e.target.value);
    box.querySelectorAll("[data-mt-beats]").forEach(b => b.onclick = () => { cfg.beats = +b.dataset.mtBeats; draw(); });
    box.querySelectorAll("[data-mt-sub]").forEach(b => b.onclick = () => { cfg.sub = +b.dataset.mtSub; draw(); });
    box.querySelector("#mt-play").onclick = () => {
      playing = !playing;
      if (playing) metroStart(() => cfg, onBeat); else metroStop();
      draw();
    };
    box.querySelector("#mt-tap").onclick = () => {
      const now = performance.now();
      if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
      taps.push(now); taps = taps.slice(-8);
      if (taps.length >= 3) { const iv = taps.slice(1).map((t, i) => t - taps[i]).sort((a, b) => a - b); setBpm(60000 / iv[Math.floor(iv.length / 2)]); }
      const tb = box.querySelector("#mt-tap"); tb.textContent = `👆 탭해서 템포 (${taps.length}번)`;
    };
    box.querySelector("#mt-listen").onclick = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { listenMsg = "이 기기에선 마이크를 쓸 수 없어요. 👆 탭으로 맞춰줘!!"; draw(); return; }
      const wasPlaying = playing; if (playing) { playing = false; metroStop(); }
      busy = true; listenMsg = "🎧 듣는 중… 곡을 크게 틀어줘!!"; draw();
      try {
        const r = await listenBpm(12, p => { const m = box.querySelector("#mt-msg"); if (m) m.textContent = `🎧 듣는 중… ${Math.round(p * 12)}/12초`; });
        if (!r) listenMsg = "소리가 너무 작았어 🥲 다시 해보거나 👆 탭으로 맞춰줘!!";
        else { setBpm(r.bpm); listenMsg = `찾았다!!! <b>${r.bpm} BPM</b>${r.clear < .2 ? " · 박이 흐릿해서 👆로 한 번 확인해줘" : ""}${r.alt ? `<br>박자 틀고 들어봐!! ${r.alt > r.bpm ? "너무 느리면" : "너무 빠르면"} → <button class="btn-sm" id="mt-alt" data-v="${r.alt}">${r.alt} BPM으로</button>` : ""}`; }
      } catch(e) { listenMsg = "마이크를 허락해야 들을 수 있어요. (설정 → Safari → 마이크)"; }
      busy = false; draw();
      if (wasPlaying) { playing = true; metroStart(() => cfg, onBeat); draw(); }
    };
    const alt = box.querySelector("#mt-alt");
    if (alt) alt.onclick = () => { setBpm(+alt.dataset.v); listenMsg = `${cfg.bpm} BPM으로 바꿨다!! 맞으면 💾 저장!!`; const m = box.querySelector("#mt-msg"); if (m) m.innerHTML = listenMsg; };
    const sv = box.querySelector("#mt-save");
    if (sv) sv.onclick = () => { opts.onSave(cfg.bpm); listenMsg = `저장했다!!! 다음에도 이 곡은 ${cfg.bpm} BPM!!`; opts.src = "내가 정함"; draw(); };
  };
  draw();
  // 창이 닫히면(바깥을 눌러도) 소리 끄기
  const watch = setInterval(() => { if (!box.isConnected) { metroStop(); clearInterval(watch); } }, 400);
}

const TALK_SEEN_KEY = "tg-talk-seen";
function hstr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function talkSeen(){ try { return JSON.parse(localStorage.getItem(TALK_SEEN_KEY) || "[]"); } catch(e) { return []; } }
function pickLine(id, key){
  const L = TALK_LINES[id] || TALK_LINES.custom; if (!L[key] && /x$/.test(key)) key = key.slice(0, -1);
  const arr = L[key]; if (!arr || !arr.length) return null;
  const seen = talkSeen(), fresh = arr.filter(x => !seen.includes(hstr(id + x)));
  const line = pick(fresh.length ? fresh : arr);
  try { localStorage.setItem(TALK_SEEN_KEY, JSON.stringify([hstr(id + line), ...seen.filter(h => h !== hstr(id + line))].slice(0, 60))); } catch(e) {}
  return line;
}
function fillLine(line, v = {}){
  return line.replace(/\{(\w+)\}/g, (_, k) => {
    if (k === "greet") return getTimeOfDay() === "day" ? "こんにちは(곤니치와·안녕)" : "こんばんは(곤방와·안녕)";
    const x = v[k]; if (x == null) return "";
    return k === "p" || k === "g" ? `<b>${esc(x)}</b>` : esc(String(x));
  });
}
function say(id, key, v, extra = {}){ const l = pickLine(id, key); v = { k: ch(id).skill, ...v }; return l ? { ev: key, t: fillLine(l, v), facts: v, ...extra } : null; }

/* 일정 → 말할 캐릭터: 스킬 일정은 담당 캐릭터, 이름으로 짐작되면(찬양 합주 → 둥둥이) 그 캐릭터.

function planSpeaker(p){
  if (p.charId) return p.charId;
  const s = suggestChar(p); if (s) return s;
  const ids = ["toon", "reels", "jp", "drum"]; return ids[hstr(p.name || p.id) % ids.length];
}
// 찬양 연습·합주 전에는 둥둥이가 이번 주 콘티 링크를 챙겨줌
function musicBefore(id, p, m){
  if (id !== "drum" || !isMusicPlan(p)) return null;
  const ws = wsWeekSet(), msg = ws && ws.songs.length ? say(id, "contiBefore", { p: p.name, m, n: ws.songs.length }) : say(id, "contiMissing", { p: p.name, m });

  const today = todayStr();
  const last = id === "reels" ? R().posts.reduce((m, p) => p.date > m && p.date <= today ? p.date : m, "") : recsOf(id).reduce((m, r) => r.date > m && r.date <= today ? r.date : m, "");
  if (!last) return null;
  const d = daysBetween(last, today); return d === 0 ? "오늘" : d === 1 ? "어제" : `${d}일 전`;
}

  const today = todayStr(), m = nowInfo().m, mon = ymd(mondayOf(new Date()));
  return state.plans.filter(p => p.charId === id && p.status === "planned" && p.date >= mon && (p.date < today || (p.date === today && p.start && (ttSpan(p) || [0, 9999])[1] <= m)))

   아이패드(사파리)는 손가락으로 한 번 누르기 전에는 소리를 못 내요.
   그래서 시작 화면이 끝나면 바로 틀어보고, 막히면 화면을 처음 누르는 순간 시작해요.
   아이패드는 audio.volume이 안 먹어서 Web Audio 볼륨(gain)으로 크기를 조절해요. */
const BGM = { el: null, ctx: null, gain: null, armed: false, want: false };
function bgmOn(){ return scenePref().bgm !== false; }
function bgmVol(){ return scenePref().bgmVol || .5; }
// 시작 화면 동안 노래 파일을 미리 받아 두기(누르면 기다림 없이 바로)
function bgmPreload(){
  if (BGM.pre || !bgmOn()) return BGM.pre;
  BGM.pre = fetch("audio/bgm.mp3").then(r => r.ok ? r.blob() : null).then(b => { if (b) BGM.url = URL.createObjectURL(b); return BGM.url; }).catch(() => null);
  return BGM.pre;
}
function bgmInit(){
  if (BGM.el) return BGM.el;
  const a = new Audio(BGM.url || "audio/bgm.mp3"); a.loop = true; a.preload = "auto"; a.setAttribute("playsinline", ""); BGM.el = a;
  try { const AC = window.AudioContext || window.webkitAudioContext; BGM.ctx = new AC(); BGM.gain = BGM.ctx.createGain(); BGM.ctx.createMediaElementSource(a).connect(BGM.gain); BGM.gain.connect(BGM.ctx.destination); }
  catch(e) { BGM.ctx = null; BGM.gain = null; }
  bgmApplyVol(); return a;
}
function bgmApplyVol(){ if (!BGM.el) return; if (BGM.gain) BGM.gain.gain.value = bgmVol(); else BGM.el.volume = bgmVol(); }
async function bgmPlay(){
  BGM.want = true;
  if (!bgmOn() || document.hidden) return;
  const a = bgmInit();
  try {
    // 터치 순간 안에서 바로 불러야 아이패드가 허락해줘서, 기다리지 않고 둘 다 한꺼번에 부름
    const jobs = [a.play()]; if (BGM.ctx && BGM.ctx.state !== "running") jobs.push(BGM.ctx.resume());
    await Promise.all(jobs);
    if (BGM.ctx && BGM.ctx.state !== "running") throw new Error("locked");
  } catch(e) { bgmArm(); }
}
const bgmPlaying = () => !!(BGM.el && !BGM.el.paused && (!BGM.ctx || BGM.ctx.state === "running"));
function bgmStop(){ if (BGM.el) BGM.el.pause(); }
function bgmArm(){
  if (BGM.armed) return; BGM.armed = true;
  const evs = ["touchend", "click", "keydown"];
  const go = () => { BGM.armed = false; evs.forEach(ev => document.removeEventListener(ev, go, true)); bgmPlay(); };
  evs.forEach(ev => document.addEventListener(ev, go, true));
}
document.addEventListener("visibilitychange", () => { if (document.hidden) bgmStop(); else if (BGM.want) bgmPlay(); });

// 시작 화면: 모찌 채널 새 글을 확인하면서 로딩바가 차오르고, 끝나면 사라짐
async function runSplash(){
  bgmPreload();
  const sp = document.getElementById("splash"); if (!sp) { await mcLoad(); return; }
  const fill = document.getElementById("sp-fill"), msg = document.getElementById("sp-msg"), t0 = Date.now();
  const setP = p => fill.style.setProperty("--p", `${p}%`);
  const setMsg = h => { msg.querySelector("span").innerHTML = h; msg.classList.remove("pop"); void msg.offsetWidth; msg.classList.add("pop"); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // 시간에 맞춰 0% → 88%까지 천천히 차오르고, 확인이 끝나면 100%
  const DUR = 2000; let p = 0;
  const creep = setInterval(() => { p = Math.min(88, (Date.now() - t0) / DUR * 88); setP(p); }, 120);
  const d = await Promise.race([mcLoad(true), wait(6000).then(() => null)]);
  if (d && d.posts && d.posts.length) {
    const seen = MC().seen, i = d.posts.findIndex(x => x.id === seen), n = i < 0 ? (seen ? d.posts.length : 0) : i;
    const p0 = d.posts[0], l = (p0.lines || []).find(x => x.ko), t = (l ? l.ko : p0.text || "").replace(/^["“'‘「]+|["”'’」]+$/g, "").trim();
    const short = t.length > 16 ? t.slice(0, 16) + "…" : t;
    setMsg(n > 0 ? `모찌 채널에 <b>‘${esc(short)}’</b>${n > 1 ? ` 외 ${n - 1}개` : ""}가 업데이트 되었습니다` : "모찌 채널은 최신 상태예요 ✓");
  } else setMsg("모찌 채널은 다음에 확인할게요");
  await wait(Math.max(0, DUR - (Date.now() - t0)));
  clearInterval(creep); setP(100);
  await wait(900);
  // 항상 "눌러서 시작" — 누르는 순간 음악을 틀어서 아이패드가 소리를 막지 않게
  if (bgmOn() && BGM.pre) { await Promise.race([BGM.pre, wait(4000)]); }
  const tap = document.createElement("img"); tap.className = "sp-tap"; tap.src = "bg/start-btn.webp"; tap.alt = "화면을 눌러 시작하기"; tap.draggable = false;
  sp.querySelector(".sp-box").appendChild(tap);
  // 아이패드는 손가락을 '뗄 때'(touchend·click)만 소리를 허락해요. 누르는 순간(pointerdown)은 안 됨
  await new Promise(res => { let done = false; const go = () => { if (done) return; done = true; sp.removeEventListener("touchend", go); sp.removeEventListener("click", go); if (bgmOn()) bgmPlay(); res(); }; sp.addEventListener("touchend", go); sp.addEventListener("click", go); });
  sp.classList.add("out"); setTimeout(() => sp.remove(), 700);
  await wait(450);
}
runSplash().then(async () => { await showTalk(); checkNow(true); });
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e)));
}
</script>
