name: 찬양 영상 챕터 모으기
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 06:00
    - cron: "0 3 * * 1"    # 월요일 낮 12:00 (콘티 오는 날) 한 번 더
  workflow_dispatch:
permissions:
  contents: write
concurrency: worship-index
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/worship-index.mjs
      - name: 바뀐 게 있으면 저장
        run: |
          git add worship/songs.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "worship-bot"
          git config user.email "worship-bot@users.noreply.github.com"
          git commit -m "찬양 영상 챕터 업데이트"
          git push
