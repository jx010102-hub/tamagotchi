name: 책 검색 연결 시험 (임시)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 카카오·구글·교보 시험
        env: { K: "${{ secrets.KAKAO_TEST_KEY }}" }
        run: |
          O="Origin: https://jx010102-hub.github.io"
          echo "== 카카오 (키 있음)"; curl -sS -G https://dapi.kakao.com/v3/search/book --data-urlencode "query=소년이 온다" -d size=3 -H "Authorization: KakaoAK $K" -H "$O" -D h.txt -o k.json -w "HTTP %{http_code}\n"
          grep -i 'access-control-allow-origin' h.txt || echo "(CORS 헤더 없음)"
          python3 -c "import json;d=json.load(open('k.json'));print('total',d.get('meta',{}).get('total_count'));[print('-',x['title'],'|',', '.join(x['authors']),'|',x['publisher'],'|',x['isbn'],'|',x['thumbnail'][:60]) for x in d.get('documents',[])]" || cat k.json
          echo "== 카카오 프리플라이트(OPTIONS)"; curl -sS -X OPTIONS https://dapi.kakao.com/v3/search/book -H "$O" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" -D - -o /dev/null | grep -i 'HTTP/\|access-control'
          echo "== 구글 도서"; curl -sS "https://www.googleapis.com/books/v1/volumes?maxResults=3&q=%EC%86%8C%EB%85%84%EC%9D%B4%20%EC%98%A8%EB%8B%A4" -H "$O" -D g.h -o g.json -w "HTTP %{http_code}\n"; grep -i 'access-control-allow-origin' g.h
          python3 -c "import json;d=json.load(open('g.json'));[print('-',x['volumeInfo'].get('title'),'|',x['volumeInfo'].get('authors'),'|',x['volumeInfo'].get('imageLinks',{}).get('thumbnail','')[:50]) for x in d.get('items',[])]"
          echo "== 교보 표지 이미지"; curl -sS -o c.jpg -w "HTTP %{http_code} %{content_type} %{size_download}\n" -H "Referer: https://jx010102-hub.github.io/" https://contents.kyobobook.co.kr/sih/fit-in/458x0/pdt/9788936434120.jpg
